<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Carnet de musculation</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;
  --surface:#141517;
  --raised:#222428;
  --line:#303337;
  --muted:#8F949A;
  --text:#ECEAE4;
  --soft:#C9C7C1;
  --danger:#D47D6E;
  --gold:#D9B45A;
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pad:12px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 15px/1.4 var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
#app{min-height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.28;cursor:default}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* En-têtes */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;height:46px;padding:0 var(--pad);background:var(--bg);border-bottom:1px solid var(--line)}
.topbar[hidden]{display:none}
.mark{font:700 21px/1 var(--cond)}
.tabs{display:flex;margin-left:auto;height:100%}
.tab{position:relative;height:100%;padding:0 10px;color:var(--muted);font:600 15px/1 var(--sans)}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--text)}
main{flex:1;display:flex;flex-direction:column}
.page{display:flex;flex-direction:column;gap:10px;padding:var(--pad)}
.sub{flex:1;display:flex;flex-direction:column}
.sub .page{padding-top:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;height:46px;padding:0 var(--pad);background:var(--bg)}
.bar .icon{margin-left:-8px;background:transparent}
.bar-t{flex:1;min-width:0;font:600 18px/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-time{margin-left:6px;font:400 13px var(--sans);color:var(--muted)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font:600 15px/1 var(--sans);text-align:center}
.btn.primary{background:var(--text);border-color:var(--text);color:#000}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(212,125,110,.45)}
.btn.wide{width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.icon{flex:none;display:inline-flex;align-items:center;justify-content:center;width:46px;height:44px;border-radius:10px;background:var(--raised);font:500 30px/1 var(--sans)}
.icon.go{background:var(--text);color:#000}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:6px}
.flab{font-size:13px;color:var(--muted)}
.inp{width:100%;height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--text);font:600 20px/1 var(--cond)}
.inp::placeholder{color:var(--muted);font-weight:500}
.inp:focus{outline:none;border-color:var(--text)}
.sel{position:relative;display:block}
.sel select{width:100%;height:46px;padding:0 38px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--text);font:600 20px/1 var(--cond);-webkit-appearance:none;appearance:none}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;border-radius:10px;background:var(--surface)}
.seg button{height:36px;border-radius:8px;color:var(--muted);font:600 13px/1 var(--sans)}
.seg button[aria-checked="true"]{background:var(--text);color:#000}
.note{margin:0;font-size:13px;color:var(--muted)}

/* Programmes */
.resume{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--raised)}
.resume-k{margin:0;font-size:13px;color:var(--muted)}
.resume-t{margin:2px 0 0;font:600 22px/1.1 var(--cond)}
.resume-t span{margin-left:6px;font:400 14px var(--sans);color:var(--muted)}
.resume-actions{display:flex;gap:8px}
.resume-actions .primary{flex:1}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prog{border-radius:14px;background:var(--surface);border:1px solid transparent}
.prog.next{border-color:var(--line)}
.prog-head{width:100%;min-height:64px;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:12px;padding:10px 12px;text-align:left}
.prog-letter{font:700 40px/1 var(--cond);color:var(--muted);text-align:center}
.prog.next .prog-letter,.prog.open .prog-letter{color:var(--text)}
.prog-main{display:flex;flex-direction:column;min-width:0}
.prog-name{font:600 23px/1.1 var(--cond);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-sub{font-size:13px;color:var(--muted)}
.tag{padding:5px 8px;border-radius:6px;border:1px solid var(--text);font:600 12px/1 var(--sans)}
.prog-body{display:flex;flex-direction:column;gap:10px;padding:0 12px 12px}
.exlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.exlist li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.exlist em{font-style:normal;color:var(--muted)}
.tgt{font:600 17px/1.2 var(--cond);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog-actions{display:flex;gap:8px}
.prog-actions>.btn{flex:1 1 0;min-width:0;padding:0 8px;font-size:14px}
.prog-actions>.primary{flex-grow:1.5}
.tab-ic{display:inline-flex;align-items:center;padding:0 10px}
.tab-ic svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
@media (max-width:340px){.mark{display:none}}

/* Séance */
.session{flex:1;display:flex;flex-direction:column;gap:8px;padding:0 var(--pad) 10px}
.session .bar{padding:0}
.ex{display:flex;flex-direction:column;gap:2px}
.ex-name{margin:0;font:700 clamp(23px,7.4vw,32px)/1.05 var(--cond)}
.ex-tgt{margin:0;font-size:13px;color:var(--muted)}
.ex-last{margin:0;font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stp{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;height:clamp(62px,15vh,92px);border-radius:12px;background:var(--surface);overflow:hidden}
.stp:focus-within{box-shadow:inset 0 0 0 2px var(--text)}
.stp-b{background:var(--raised);font:400 28px/1 var(--sans)}
.stp-b:active{background:var(--line)}
.stp-v{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;cursor:text}
.stp-v input{width:100%;padding:0;border:0;background:none;color:var(--text);text-align:center;font:600 clamp(31px,9.6vw,54px)/1 var(--cond);font-variant-numeric:tabular-nums}
.stp-v input:focus{outline:none}
.stp-v span{margin-top:2px;font-size:11px;color:var(--muted)}
.validate{width:100%;min-height:clamp(48px,11vh,62px);font-size:16px}
.sets{display:flex;align-items:center;gap:6px;min-height:34px;overflow-x:auto;scrollbar-width:none}
.sets::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 11px;border-radius:999px;background:var(--raised);font:600 17px/1 var(--cond);font-variant-numeric:tabular-nums}
.chip.warn{background:transparent;border:1px solid var(--danger);color:var(--danger);font:600 13px/1 var(--sans)}
.chip.flash{animation:flash .7s ease-out}
@keyframes flash{from{background:var(--text);color:#000}to{background:var(--raised);color:var(--text)}}
.sets-empty{font-size:13px;color:var(--muted)}
.exnav{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.pos{margin-right:2px;font:600 17px/1 var(--cond);color:var(--muted);font-variant-numeric:tabular-nums}

/* Éditeur de programme */
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.erow{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--surface)}
.erow-top{display:flex;align-items:center;gap:6px}
.erow-name{flex:1;min-width:0;font:600 19px/1.15 var(--cond)}
.mini{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;background:var(--raised);font:500 18px/1 var(--sans)}
.erow-stp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mstp{display:grid;grid-template-columns:40px 1fr 40px;height:46px;border-radius:10px;background:var(--raised);overflow:hidden}
.mstp button{font:400 22px/1 var(--sans)}
.mstp button:active{background:var(--line)}
.mstp output{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);font:600 21px/1 var(--cond);font-variant-numeric:tabular-nums}
.mstp output small{margin-top:1px;font:500 10px/1.2 var(--sans);color:var(--muted)}
.pg{margin:12px 0 2px;font:600 13px/1 var(--sans);color:var(--muted)}
.pick{width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.pick small{flex:none;font-size:12px;color:var(--muted)}

/* Progrès */
.chart{position:relative;height:clamp(150px,32vh,250px);margin:0;border-radius:14px;background:var(--surface);overflow:hidden}
.chart svg{display:block}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--text);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.chart .d{fill:var(--surface);stroke:var(--text);stroke-width:1.75}
.chart .dl{fill:var(--text)}
.chart text{font:500 11px var(--sans);fill:var(--muted)}
.chart .vl{font:600 16px var(--cond);fill:var(--text)}
.cap{margin:-2px 0 0;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{min-width:0;padding:8px 10px;border-radius:12px;background:var(--surface)}
.stat-k{display:block;font-size:12px;color:var(--muted)}
.stat-v{display:block;font:600 23px/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stat-v small{margin-left:2px;font:500 12px var(--sans);color:var(--muted)}
.h2{margin:10px 0 0;font:600 21px/1 var(--cond)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hrow{border-radius:12px;background:var(--surface)}
.hhead{width:100%;display:grid;grid-template-columns:62px 1fr auto;align-items:baseline;gap:10px;padding:12px;text-align:left}
.hdate{font-size:13px;color:var(--muted)}
.hprog{min-width:0;font:600 19px/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmeta{font-size:13px;color:var(--muted);white-space:nowrap}
.hbody{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px}
.hex{display:flex;flex-direction:column;padding-top:6px;border-top:1px solid var(--line);font-size:14px}
.hsets{font:500 17px/1.3 var(--cond);color:var(--soft);word-spacing:.35em;font-variant-numeric:tabular-nums}
.hbody .btn{margin-top:4px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px 4px 4px}
.empty-t{margin:0;font:600 26px/1.1 var(--cond)}
.empty p{margin:0;color:var(--muted)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:60;max-width:calc(100% - 24px);padding:10px 14px;border-radius:10px;background:var(--text);color:#000;font:600 14px/1.2 var(--sans);transform:translate(-50%,-160%);transition:transform .25s ease;pointer-events:none}
.toast.show{transform:translate(-50%,0)}

/* Nouveautés : suggestion, repos, glissement, réglages, poids, calendrier */
.rep{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.sug{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:5px;background:var(--gold);color:#000;font:700 12px/1.4 var(--sans)}
.timer{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 14px 9px;border-radius:12px;background:var(--surface);overflow:hidden}
.tm-v{font:700 clamp(40px,12.5vh,76px)/1.02 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tm-l{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font-size:12px;line-height:1.3;color:var(--muted)}
.tm-l b{font:600 15px/1.2 var(--sans);color:var(--text)}
.tm-bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--raised)}
.tm-bar i{display:block;width:calc(var(--p,0) * 100%);height:100%;background:var(--text)}
.timer.run .tm-bar i{transition:width 1s linear}
.timer.idle .tm-v{color:var(--muted)}
.timer.idle .tm-l b{color:var(--soft)}
.timer.done{background:var(--text);color:#000}
.timer.done .tm-l,.timer.done .tm-l b{color:#000}
.timer.done .tm-bar{display:none}
.timer.ping{animation:tm-ping .7s ease-out}
@keyframes tm-ping{0%{transform:scale(1.04);box-shadow:0 0 0 0 rgba(236,234,228,.7)}100%{transform:scale(1);box-shadow:0 0 0 14px rgba(236,234,228,0)}}
/* Écrans courts (écran externe du Flip) : tout tient sans défiler */
@media (max-height:430px){
  .session{gap:6px}
  .session .bar{height:42px}
  .ex-name{font-size:22px}
  .timer{padding:2px 12px 7px}
  .tm-v{font-size:42px}
  .stp{height:58px}
  .validate{min-height:44px}
  .sets{min-height:32px}
  .chip{height:30px}
  .exnav .icon{height:40px}
}
@media (max-height:380px){
  .tm-v{font-size:38px}
  .stp{height:54px}
  .validate{min-height:42px}
  .ex-tgt{display:none}
}
.session.slide-l .ex,.session.slide-l .steppers{animation:sl-l .24s cubic-bezier(.2,.8,.2,1) both}
.session.slide-r .ex,.session.slide-r .steppers{animation:sl-r .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes sl-l{from{opacity:.2;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes sl-r{from{opacity:.2;transform:translateX(-36px)}to{opacity:1;transform:none}}
.seg5{grid-template-columns:repeat(5,1fr)}
.seg5 button{font-size:12px}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:8px 12px;border-radius:12px;background:var(--surface);text-align:left}
.sw-l{display:flex;flex-direction:column;font:600 15px/1.25 var(--sans)}
.sw-l small{font:400 12px/1.3 var(--sans);color:var(--muted)}
.sw{position:relative;flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw-row[aria-checked="true"] .sw{background:var(--text)}
.sw-row[aria-checked="true"] .sw::after{transform:translateX(18px);background:#000}
.bw-stp{grid-template-columns:52px minmax(0,1fr) 52px}
.wrow{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--surface)}
.wrow .hdate{flex:1}
.wkg{font:600 19px/1 var(--cond);font-variant-numeric:tabular-nums}
.mini.warn{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.rest-stp{max-width:220px}
.rest-stp output{font-size:19px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.cal-t{font:600 21px/1 var(--cond)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{padding:2px 0;font-size:11px;color:var(--muted);text-align:center}
.cday{position:relative;aspect-ratio:1/1;border-radius:9px;background:var(--surface);color:var(--muted);font:600 16px/1 var(--cond);font-variant-numeric:tabular-nums}
.cday.on{background:var(--text);color:#000}
.cday.two::after{content:"";position:absolute;left:50%;bottom:12%;width:4px;height:4px;margin-left:-6px;border-radius:50%;background:#000;box-shadow:8px 0 0 #000}
.cday.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.cday.future{opacity:.35}
.cday.picked:not(.today){box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--muted)}
.cal-info{margin:2px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:14px;color:var(--soft)}
.cal-info b{display:block;margin-bottom:2px;font:600 18px/1.1 var(--cond);color:var(--text)}

/* Animations de motivation */
.fx{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(0,0,0,.975);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-user-select:none;user-select:none;animation:fx-in .18s ease-out both}
.fx[hidden]{display:none}
.fx.out{animation:fx-out .2s ease-in both}
.fx canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fx-stage{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center}
@keyframes fx-in{from{opacity:0}to{opacity:1}}
@keyframes fx-out{from{opacity:1}to{opacity:0}}
@keyframes fx-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fx-phrase{margin:0;font:700 clamp(26px,8vw,40px)/1.05 var(--cond);animation:fx-up .4s ease-out .3s both}
.fx.rec .fx-phrase{color:var(--gold)}
.fx-next{margin:0;font-size:13px;color:var(--muted);animation:fx-up .4s ease-out .5s both}
.fx-next b{display:block;margin:2px 0;font:600 clamp(20px,6vw,26px)/1.1 var(--cond);color:var(--text)}

/* Intermédiaire : anneau */
.ring-wrap{position:relative;width:min(52vw,36vh,210px);aspect-ratio:1/1;margin-bottom:4px}
.ring{display:block;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring-bg{fill:none;stroke:var(--raised);stroke-width:9}
.ring-fg{fill:none;stroke:var(--text);stroke-width:9;animation:ring-fill .65s cubic-bezier(.3,.7,.2,1) .12s both}
.fx.rec .ring-fg{stroke:var(--gold)}
.ring-ticks line{stroke:#000;stroke-width:2.5}
@keyframes ring-fill{from{stroke-dashoffset:var(--o1)}to{stroke-dashoffset:var(--o2)}}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num b{font:700 clamp(46px,15vw,76px)/1 var(--cond);font-variant-numeric:tabular-nums}
.ring-num b.pop{animation:fx-pop .38s cubic-bezier(.2,1.6,.4,1) both}
.ring-num small{font-size:13px;color:var(--muted)}
.ring-pulse{position:absolute;inset:4.5%;border-radius:50%;border:2px solid var(--text);opacity:0;animation:fx-pulse .7s ease-out .74s both}
.fx.rec .ring-pulse{border-color:var(--gold)}
@keyframes fx-pop{from{transform:scale(1.5)}to{transform:scale(1)}}

.chalk-line{display:block;width:62%;max-width:260px;height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(236,234,228,.92) 0 9px,rgba(236,234,228,.5) 9px 13px);transform-origin:left center;animation:fx-line .38s cubic-bezier(.5,0,.2,1) .4s both}
.fx.rec .chalk-line{background:var(--gold)}
.fx-chalk .fx-next{animation-delay:.62s}

/* Intermédiaire : typo */

@keyframes fx-bg{from{opacity:0;transform:translate(-50%,-52%) scale(1.5)}25%{opacity:1}to{opacity:1;transform:translate(-50%,-52%) scale(1.08)}}

@keyframes fx-slam{from{opacity:0;transform:scale(2.6)}to{opacity:1;transform:scale(1)}}
@keyframes fx-shake{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,1px)}100%{transform:translate(0,0)}}
.slam-bar{display:block;width:70%;max-width:300px;height:6px;background:var(--text);animation:fx-line-c .3s cubic-bezier(.5,0,.2,1) var(--bar,.62s) both}
.fx.rec .slam-bar{background:var(--gold)}
@keyframes fx-line-c{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fx-slam .fx-next{animation:fx-slide .38s cubic-bezier(.2,.8,.2,1) var(--nxt,.74s) both}

/* Finales */

.fx-fire .fin-t{font-size:clamp(26px,8vw,38px);animation-delay:calc(var(--d0) + .45s)}

.fin-rec{margin:0;font:600 15px/1.3 var(--sans);color:var(--gold);animation:fx-up .4s ease-out calc(var(--d0) + .45s) both}
.fin-btn{min-width:220px;margin-top:6px;animation:fx-up .4s ease-out calc(var(--d0) + .6s) both}
.fx-fire .fin-rec{animation-delay:calc(var(--d0) + .75s)}
.fx-fire .fin-btn{animation-delay:calc(var(--d0) + .85s)}
@keyframes fx-big{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}

@keyframes fx-swing{0%{transform:rotate(0)}15%{transform:rotate(12deg)}35%{transform:rotate(-8deg)}55%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
@keyframes fx-shine{from{transform:translateX(-40px) skewX(-20deg)}to{transform:translateX(150px) skewX(-20deg)}}

@keyframes fx-twinkle{0%{opacity:0;transform:scale(0) rotate(0)}30%{opacity:1;transform:scale(1) rotate(45deg)}60%{opacity:0;transform:scale(.3) rotate(90deg)}100%{opacity:0;transform:scale(0)}}

/* Réglages */

/* Animation d'ouverture : « Prêt à tout casser ? » (Fissure) */
#splash{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;cursor:pointer;animation:sp-out .45s ease-in 3.55s forwards}

.sp-ph{position:relative;z-index:1;margin:0;font:800 min(24vw,16.5vh,150px)/.9 var(--cond);color:var(--text);text-align:center;letter-spacing:-.005em}

.sp-half.b{position:absolute;left:0;top:0;clip-path:polygon(0 58%,18% 52%,31% 63%,47% 47%,60% 56%,76% 42%,100% 46%,100% 100%,0 100%);animation:sp-split-b .45s cubic-bezier(.2,.9,.2,1) 1.4s both}
.sp-crack{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;opacity:0;clip-path:inset(0 100% 0 0);animation:sp-crack .6s ease-out 1.35s forwards}
.sp-crack polyline{fill:none;stroke:#fff;stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.sp-q{display:inline-block;color:var(--gold);animation:sp-drop .45s cubic-bezier(.3,1.5,.5,1) 1.75s both,sp-glow .9s ease-in-out 2.6s}
@keyframes sp-slam{from{opacity:0;transform:scale(3);filter:blur(8px)}to{opacity:1;transform:scale(1);filter:none}}
@keyframes sp-slam-big{from{opacity:0;transform:scale(4.2);filter:blur(10px)}to{opacity:1;transform:scale(1);filter:none}}
@keyframes sp-split-a{from{transform:none}to{transform:translate(-2.5%,-5%) rotate(-2.5deg)}}
@keyframes sp-split-b{from{transform:none}to{transform:translate(2%,4%) rotate(1.8deg)}}
@keyframes sp-crack{0%{opacity:1;clip-path:inset(0 100% 0 0)}25%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 0)}}
@keyframes sp-drop{from{opacity:0;transform:translateY(-160%) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes sp-shake{0%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}100%{transform:translate(0,0)}}
@keyframes sp-shake-big{0%{transform:translate(0,0) rotate(0)}15%{transform:translate(-10px,6px) rotate(-1deg)}30%{transform:translate(9px,-6px) rotate(1deg)}50%{transform:translate(-6px,3px)}70%{transform:translate(4px,-2px)}100%{transform:translate(0,0)}}
@keyframes sp-flash{0%{opacity:0}25%{opacity:.85}100%{opacity:0}}
@keyframes sp-push{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes sp-zoom{from{transform:scale(1.06);filter:none}to{transform:scale(1.7);filter:blur(6px)}}
@keyframes sp-glow{0%,100%{text-shadow:0 0 0 rgba(217,180,90,0)}50%{text-shadow:0 0 22px rgba(217,180,90,.85),0 0 4px rgba(243,218,146,.9)}}
@keyframes sp-out{from{opacity:1}to{opacity:0;visibility:hidden}}

<script>
(() => {
'use strict';

/* ---------- Catalogue d'exercices ---------- */
const GROUPS = ['Pectoraux', 'Dos', 'Épaules', 'Bras', 'Jambes', 'Abdos', 'Autre'];
const PH = 'kg par haltère';
const EX = {
  dc:     {g:'Pectoraux', name:'Développé couché', step:2.5, start:60},
  dib:    {g:'Pectoraux', name:'Développé incliné barre', step:2.5, start:50},
  dch:    {g:'Pectoraux', name:'Développé couché haltères', step:2, start:30, unit:PH},
  dih:    {g:'Pectoraux', name:'Développé incliné haltères', step:2, start:26, unit:PH},
  dd:     {g:'Pectoraux', name:'Développé décliné', step:2.5, start:60},
  ecp:    {g:'Pectoraux', name:'Écarté poulie vis-à-vis', step:2.5, start:15},
  ech:    {g:'Pectoraux', name:'Écarté haltères', step:2, start:14, unit:PH},
  pec:    {g:'Pectoraux', name:'Pec deck', step:2.5, start:40},
  pompes: {g:'Pectoraux', name:'Pompes', step:2.5, start:0, bw:true, bwf:0.65},
  dips:   {g:'Pectoraux', name:'Dips', step:2.5, start:0, bw:true},
  trac:   {g:'Dos', name:'Tractions', step:2.5, start:0, bw:true},
  tsup:   {g:'Dos', name:'Tractions supination', step:2.5, start:0, bw:true},
  tv:     {g:'Dos', name:'Tirage vertical prise large', step:2.5, start:55},
  tvs:    {g:'Dos', name:'Tirage vertical prise serrée', step:2.5, start:55},
  rb:     {g:'Dos', name:'Rowing barre', step:2.5, start:60},
  rh:     {g:'Dos', name:'Rowing haltère un bras', step:2, start:30},
  rpb:    {g:'Dos', name:'Rowing poulie basse', step:2.5, start:55},
  rt:     {g:'Dos', name:'Rowing T-bar', step:2.5, start:40},
  pop:    {g:'Dos', name:'Pull-over poulie', step:2.5, start:25},
  sdt:    {g:'Dos', name:'Soulevé de terre', step:2.5, start:100},
  shrug:  {g:'Dos', name:'Shrugs', step:2.5, start:60},
  dm:     {g:'Épaules', name:'Développé militaire debout', step:2.5, start:40},
  dha:    {g:'Épaules', name:'Développé haltères assis', step:2, start:22, unit:PH},
  el:     {g:'Épaules', name:'Élévations latérales', step:1, start:10, unit:PH},
  elp:    {g:'Épaules', name:'Élévations latérales poulie', step:1, start:5},
  ois:    {g:'Épaules', name:'Oiseau haltères', step:1, start:8, unit:PH},
  fp:     {g:'Épaules', name:'Face pull', step:2.5, start:20},
  rmen:   {g:'Épaules', name:'Rowing menton', step:2.5, start:30},
  curl:   {g:'Bras', name:'Curl barre EZ', step:2.5, start:30},
  curlh:  {g:'Bras', name:'Curl haltères', step:1, start:14, unit:PH},
  ci:     {g:'Bras', name:'Curl incliné haltères', step:1, start:12, unit:PH},
  cm:     {g:'Bras', name:'Curl marteau', step:1, start:14, unit:PH},
  cp:     {g:'Bras', name:'Curl pupitre', step:2.5, start:25},
  ext:    {g:'Bras', name:'Extension triceps à la poulie', step:2.5, start:25},
  baf:    {g:'Bras', name:'Barre au front', step:2.5, start:30},
  enh:    {g:'Bras', name:'Extension nuque haltère', step:2, start:20},
  dcps:   {g:'Bras', name:'Développé couché prise serrée', step:2.5, start:50},
  sq:     {g:'Jambes', name:'Squat', step:2.5, start:80},
  gob:    {g:'Jambes', name:'Goblet squat', step:2, start:24},
  presse: {g:'Jambes', name:'Presse à cuisses', step:5, start:120},
  fb:     {g:'Jambes', name:'Fentes bulgares', step:2, start:16, unit:PH},
  sdtr:   {g:'Jambes', name:'Soulevé de terre roumain', step:2.5, start:80},
  lc:     {g:'Jambes', name:'Leg curl', step:2.5, start:40},
  lext:   {g:'Jambes', name:'Leg extension', step:2.5, start:40},
  ht:     {g:'Jambes', name:'Hip thrust', step:5, start:80},
  mol:    {g:'Jambes', name:'Mollets debout', step:2.5, start:60},
  rjs:    {g:'Abdos', name:'Relevés de jambes suspendu', step:1, start:0, bw:true, bwf:0},
  crp:    {g:'Abdos', name:'Crunch poulie', step:2.5, start:30},
  roue:   {g:'Abdos', name:'Roue abdominale', step:1, start:0, bw:true, bwf:0},
};

const DEFAULT_PROGRAMS = [
  {id:'A', name:'Force', desc:'Charges lourdes, peu de répétitions.', rest:150, items:[
    {ex:'dc', sets:5, reps:5},
    {ex:'trac', sets:5, reps:5, hint:'lestées'},
    {ex:'dm', sets:4, reps:6},
    {ex:'rb', sets:4, reps:6},
    {ex:'dips', sets:3, reps:8, hint:'lestés'},
  ]},
  {id:'B', name:'Volume', desc:'Hypertrophie, séries de 10 à 15 répétitions.', rest:75, items:[
    {ex:'dih', sets:4, reps:10},
    {ex:'tv', sets:4, reps:10},
    {ex:'el', sets:4, reps:15},
    {ex:'rh', sets:3, reps:12},
    {ex:'fp', sets:3, reps:15},
    {ex:'ext', sets:3, reps:12},
    {ex:'ci', sets:3, reps:12},
  ]},
  {id:'C', name:'Complet', desc:'Haut du corps et jambes légères.', rest:90, items:[
    {ex:'dch', sets:4, reps:8},
    {ex:'trac', sets:4, reps:8, label:'max'},
    {ex:'sdtr', sets:3, reps:8},
    {ex:'dha', sets:3, reps:10},
    {ex:'rpb', sets:3, reps:12},
    {ex:'gob', sets:3, reps:10},
    {ex:'rjs', sets:3, reps:12},
  ]},
];

const METRICS = [
  {id:'e1rm', short:'1RM', unit:'kg', cap:'1RM estimé à partir de ta meilleure série de chaque séance (formule d’Epley).'},
  {id:'max',  short:'Charge', unit:'kg', cap:'Charge la plus lourde soulevée à chaque séance.'},
  {id:'vol',  short:'Volume', unit:'kg', cap:'Charge × répétitions, toutes séries confondues.'},
  {id:'reps', short:'Reps', unit:'reps', cap:'Plus grand nombre de répétitions en une série.'},
  {id:'rel',  short:'Relatif', unit:'%', cap:'1RM estimé en pourcentage de ton poids de corps du jour. S’il reste stable pendant que ton poids baisse, tu gardes ta force.'},
];
const OLD_REST = {A:150, B:75, C:90};
const restOf = p => (p && p.rest) || (p && OLD_REST[p.id]) || 90;

/* ---------- Stockage local ---------- */
const K = {sessions:'carnet.v1.sessions', draft:'carnet.v1.draft', programs:'carnet.v1.programs', customEx:'carnet.v1.customEx', prefs:'carnet.v1.prefs', weights:'carnet.v1.weights'};
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('Stockage plein ou indisponible'); } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
const clone = o => JSON.parse(JSON.stringify(o));
const validSession = s => !!s && typeof s.id === 'string' && typeof s.date === 'string' && Array.isArray(s.items)
  && s.items.every(it => it && typeof it.ex === 'string' && Array.isArray(it.sets));
const validProgram = p => !!p && typeof p.id === 'string' && typeof p.name === 'string' && Array.isArray(p.items)
  && p.items.every(it => it && typeof it.ex === 'string' && it.sets > 0 && it.reps > 0);

const state = {
  view:'programs', openProgram:null, draft:null,
  programs:null, customEx:{}, sessions:[],
  progEx:null, metric:'e1rm', openSession:null, confirm:null, flash:null,
  edit:null, pickQuery:'', newEx:null, scrollEnd:false,
  prefs:Object.assign({inter:'ring', final:'confetti', wake:true, vibrate:true, sound:false}, LS.get(K.prefs, {}) || {}),
  weights:[], progTab:'ex', calMonth:null, calDay:null, slide:null,
};
{
  const ps = LS.get(K.programs, null);
  state.programs = Array.isArray(ps) ? ps.filter(validProgram) : clone(DEFAULT_PROGRAMS);
  if (!Array.isArray(ps)) LS.set(K.programs, state.programs);
  const cx = LS.get(K.customEx, {});
  state.customEx = cx && typeof cx === 'object' && !Array.isArray(cx) ? cx : {};
  state.sessions = (LS.get(K.sessions, []) || []).filter(validSession);
  const ws = LS.get(K.weights, []);
  state.weights = (Array.isArray(ws) ? ws : []).filter(w => w && typeof w.d === 'string' && w.kg > 0).sort((a, b) => a.d.localeCompare(b.d));
}

const prog = id => state.programs.find(p => p.id === id);
const exInfo = id => EX[id] || state.customEx[id] || null;
const persist = () => LS.set(K.sessions, state.sessions);
const persistPrograms = () => LS.set(K.programs, state.programs);
const persistCustomEx = () => LS.set(K.customEx, state.customEx);
const saveDraft = () => { if (state.draft) LS.set(K.draft, state.draft); };
const persistWeights = () => LS.set(K.weights, state.weights);

function loadDraft(){
  const d = LS.get(K.draft, null);
  if (!d || !Array.isArray(d.items)) return null;
  if (!d.plan){ const p = prog(d.program); if (!p) return null; d.plan = {name:p.name, rest:restOf(p), items:clone(p.items)}; }
  if (!d.plan.rest) d.plan.rest = restOf(prog(d.program));
  if (!Array.isArray(d.plan.items) || d.plan.items.length !== d.items.length) return null;
  d.inputs = d.inputs || {};
  return d;
}
state.draft = loadDraft();

/* ---------- Utilitaires ---------- */
const h = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const round2 = n => Math.round(n * 100) / 100;
const parseNum = v => parseFloat(String(v).replace(',', '.').replace(/[^\d.\-]/g, ''));
const fmt = n => Number(n).toLocaleString('fr-FR', {maximumFractionDigits:2});
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const e1rm = (w, r) => r <= 0 ? 0 : (r === 1 ? w : w * (1 + r / 30));
const sorted = () => state.sessions.slice().sort((a, b) => a.date.localeCompare(b.date));
const letter = name => (String(name).trim().charAt(0) || '?').toUpperCase();
const pad2 = n => String(n).padStart(2, '0');
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const keyDate = k => new Date(k + 'T12:00:00');
const mmss = sec => `${Math.floor(sec / 60)}:${pad2(Math.floor(sec % 60))}`;
function fmtRest(sec){
  const m = Math.floor(sec / 60), r = sec % 60;
  if (!m) return `${r} s`;
  return r ? `${m} min ${pad2(r)}` : `${m} min`;
}
/* Poids de corps à une date : dernière pesée connue à ce jour, sinon la première */
function bwAt(iso){
  const ws = state.weights;
  if (!ws.length) return null;
  const k = dayKey(iso);
  let v = null;
  for (const w of ws){ if (w.d <= k) v = w.kg; else break; }
  return v != null ? v : ws[0].kg;
}
const bwFactor = id => { const e = exInfo(id); return e && e.bw ? (e.bwf != null ? e.bwf : 1) : 0; };
/* Charge réelle : lest + poids de corps pour les exercices au poids du corps */
function effSets(exId, sets, iso){
  const f = bwFactor(exId);
  const bw = f > 0 ? bwAt(iso) : null;
  return bw ? sets.map(x => ({w:x.w + f * bw, r:x.r})) : sets;
}
const setsOf = (s, exId) => s.items.filter(it => it.ex === exId).flatMap(it => it.sets);
const volumeOf = (exId, sets, iso) => effSets(exId, sets, iso).reduce((a, x) => a + x.w * x.r, 0);

function exName(id){
  const e = exInfo(id); if (e) return e.name;
  for (const s of state.sessions) for (const it of s.items) if (it.ex === id && it.name) return it.name;
  return 'Exercice';
}
function fmtSet(s, bw){
  if (bw) return s.w > 0 ? `+${fmt(s.w)}×${s.r}` : `${s.r} reps`;
  return `${fmt(s.w)}×${s.r}`;
}
function lastLine(sets, bw){
  const groups = [];
  for (const s of sets){
    const g = groups[groups.length - 1];
    if (g && g.w === s.w) g.r.push(s.r); else groups.push({w:s.w, r:[s.r]});
  }
  return groups.map(g => (bw && g.w === 0 ? 'PDC' : (bw ? '+' : '') + fmt(g.w) + ' kg') + ' : ' + g.r.join(', ')).join(' / ');
}
function lastPerf(exId, excludeId){
  const list = sorted();
  for (let i = list.length - 1; i >= 0; i--){
    const s = list[i];
    if (s.id === excludeId) continue;
    const sets = s.items.filter(it => it.ex === exId).flatMap(it => it.sets);
    if (sets.length) return sets;
  }
  return null;
}
function daysAgo(t){
  const a = new Date(t); a.setHours(0,0,0,0);
  const b = new Date(); b.setHours(0,0,0,0);
  return Math.round((b - a) / 86400000);
}
function lastDoneTime(pid){
  let t = -Infinity;
  for (const s of state.sessions) if (s.program === pid) t = Math.max(t, Date.parse(s.date));
  return t;
}
function lastDoneLabel(pid){
  const t = lastDoneTime(pid);
  if (t === -Infinity) return 'Jamais faite';
  const d = daysAgo(t);
  if (d <= 0) return 'Faite aujourd’hui';
  if (d === 1) return 'Faite hier';
  return `Faite il y a ${d} jours`;
}
function suggestNext(){
  let best = null, bt = Infinity;
  for (const p of state.programs){ const t = lastDoneTime(p.id); if (t < bt){ bt = t; best = p.id; } }
  return best;
}
function elapsed(start){
  const m = Math.max(0, Math.floor((Date.now() - start) / 60000));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;
}
function restInfo(d){
  if (!d || !d.lastSetAt) return null;
  const sec = Math.floor((Date.now() - d.lastSetAt) / 1000);
  if (sec > 900) return null;
  const target = d.plan.rest || 90;
  const done = sec >= target;
  return {sec, target, done, p:Math.min(1, sec / target),
    txt:done ? `Repos fini, ${mmss(sec)}` : `Repos ${mmss(sec)} / ${mmss(target)}`};
}
const dateShort = iso => new Date(iso).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
const dateTiny = iso => new Date(iso).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
const volFmt = v => v >= 1000 ? `${fmt(Math.round(v / 100) / 10)} t` : `${fmt(Math.round(v))} kg`;

/* Minuteur de repos : compte à rebours jusqu'à la cible, puis dépassement */
function timerState(d){
  const target = (d.plan && d.plan.rest) || 90;
  const ri = restInfo(d);
  if (!ri) return {cls:'idle', v:mmss(target), l:'<b>Repos prévu</b>après chaque série', p:0};
  if (ri.done) return {cls:'done', v:'+' + mmss(ri.sec - target), l:'<b>C’est reparti</b>repos terminé', p:1};
  return {cls:'run', v:mmss(target - ri.sec), l:`<b>Repos</b>sur ${mmss(target)}`, p:ri.p};
}
function timerHtml(d){

/* Progression suggérée : toutes les reps cibles réussies la dernière fois → un palier de plus */
function suggestion(it, excludeId){
  const ex = exInfo(it.ex) || {step:2.5};
  const lp = lastPerf(it.ex, excludeId);
  if (!lp || !lp.length) return null;
  if (it.label) return {w:lp[0].w, r:lp[0].r, inc:0};
  const hit = lp.length >= it.sets && lp.slice(0, it.sets).every(x => x.r >= it.reps);
  return hit ? {w:round2(lp[0].w + ex.step), r:it.reps, inc:ex.step} : {w:lp[0].w, r:it.reps, inc:0};
}
function inputsFor(i){
  const d = state.draft;
  if (d.inputs[i]) return d.inputs[i];
  const it = d.plan.items[i], ex = exInfo(it.ex) || {step:2.5, start:0}, cur = d.items[i];
  let w = ex.start, r = it.reps, inc = 0;
  if (cur.sets.length){ const l = cur.sets[cur.sets.length - 1]; w = l.w; r = l.r; }
  else { const sg = suggestion(it, d.id); if (sg){ w = sg.w; r = sg.r; inc = sg.inc; } }
  return (d.inputs[i] = {w, r, inc});
}
function stepper(f, val, label, step, what){

/* ---------- Vue : progrès ---------- */
const metricObj = () => METRICS.find(m => m.id === state.metric) || METRICS[0];
function defaultMetric(exId){
  if (bwFactor(exId) > 0 && state.weights.length) return 'e1rm';
  const sets = state.sessions.flatMap(s => setsOf(s, exId));
  return sets.length && sets.every(s => !s.w) ? 'reps' : 'e1rm';
}
function seriesFor(exId, metric){
  return sorted().map(s => {
    const raw = setsOf(s, exId);
    if (!raw.length) return null;
    const sets = effSets(exId, raw, s.date);
    let v;
    if (metric === 'e1rm') v = Math.max(...sets.map(x => e1rm(x.w, x.r)));
    else if (metric === 'max') v = Math.max(...sets.map(x => x.w));
    else if (metric === 'vol') v = sets.reduce((a, x) => a + x.w * x.r, 0);
    else if (metric === 'rel'){
      const bw = bwAt(s.date);
      if (!bw) return null;
      return {iso:s.date, v:Math.round(Math.max(...sets.map(x => e1rm(x.w, x.r))) / bw * 1000) / 10};
    }
    else v = Math.max(...sets.map(x => x.r));
    return {iso:s.date, v:Math.round(v * 10) / 10};
  }).filter(Boolean);
}
function metricHtml(v, m){
  if (m.id === 'vol'){ const t = volFmt(v).split(' '); return `${t[0]}<small>${t[1]}</small>`; }
  return `${fmt(Math.round(v * 10) / 10)}<small>${m.unit}</small>`;
}

function viewExercises(){

  if (!state.progEx || !exIds.includes(state.progEx)){

  } else {
    stats = `<p class="note">${m.id === 'rel' ? 'Ajoute une pesée dans l’onglet Poids pour voir ta force relative.' : 'Pas de donnée pour cette mesure.'}</p>`;

/* Poids de corps */
function viewWeight(){
  const ws = state.weights, last = ws[ws.length - 1];
  const today = dayKey(Date.now());
  const val = state.bwInput != null ? state.bwInput : (last ? last.kg : 110);
  const doneToday = last && last.d === today;
  let stats = '';
  if (ws.length){
    const first = ws[0];
    const cut = dayKey(Date.now() - 30 * 86400000);
    let ref30 = null; for (const w of ws){ if (w.d <= cut) ref30 = w; }
    if (!ref30) ref30 = first;
    const sd = v => (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(Math.round(v * 10) / 10)) + '<small>kg</small>';
    stats = statBlocks([['Actuel', fmt(last.kg) + '<small>kg</small>'], ['Depuis le début', ws.length > 1 ? sd(last.kg - first.kg) : '—'], ['30 jours', ws.length > 1 ? sd(last.kg - ref30.kg) : '—']]);
  }
  let out = `<span class="flab">${doneToday ? 'Pesée du jour enregistrée, tu peux la corriger' : 'Ta pesée du jour'}</span>
    <div class="stp bw-stp">
      <button class="stp-b rep" data-action="bw-dec" aria-label="Diminuer le poids">−</button>
      <label class="stp-v"><input id="bw-in" inputmode="decimal" enterkeyhint="done" autocomplete="off" value="${fmt(val)}" aria-label="Poids en kg"><span>kg</span></label>
      <button class="stp-b rep" data-action="bw-inc" aria-label="Augmenter le poids">+</button>
    </div>
    <button class="btn primary wide" data-action="bw-save">${doneToday ? 'Mettre à jour la pesée' : 'Enregistrer la pesée'}</button>`;
  if (!ws.length) return out + '<p class="note">Ton poids sert à calculer ta force relative et la charge réelle des tractions et des dips.</p>';
  out += `<figure class="chart" id="bw-chart"></figure>${stats}<h2 class="h2">Pesées</h2><ul class="hist">`;
  for (const w of ws.slice().reverse()){
    const armed = state.confirm === 'delw' + w.d;
    out += `<li class="wrow"><span class="hdate">${keyDate(w.d).toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'})}</span>
      <span class="wkg">${fmt(w.kg)} kg</span>
      <button class="mini ${armed ? 'warn' : ''}" data-action="del-w" data-id="${w.d}" aria-label="Supprimer la pesée">${armed ? '?' : '×'}</button></li>`;
  }
  return out + '</ul>';
}

/* Régularité */
function viewCalendar(){
  const now = new Date();
  if (!state.calMonth) state.calMonth = {y:now.getFullYear(), m:now.getMonth()};
  const {y, m} = state.calMonth;
  const byDay = {};
  for (const s of state.sessions){ const k = dayKey(s.date); (byDay[k] = byDay[k] || []).push(s); }
  const todayK = dayKey(now);
  // Statistiques
  const monday = new Date(now); monday.setHours(0, 0, 0, 0); monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  const week = state.sessions.filter(s => Date.parse(s.date) >= monday.getTime()).length;
  const month = state.sessions.filter(s => { const d = new Date(s.date); return d.getFullYear() === y && d.getMonth() === m; }).length;
  let streak = 0; const c = new Date(now); c.setHours(12, 0, 0, 0);
  if (!byDay[todayK]) c.setDate(c.getDate() - 1);
  while (byDay[dayKey(c)]){ streak++; c.setDate(c.getDate() - 1); }
  const title = new Date(y, m, 1).toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  const isCurrent = y === now.getFullYear() && m === now.getMonth();
  let grid = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(d => `<span class="cal-h">${d}</span>`).join('');
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < lead; i++) grid += '<span></span>';
  for (let d = 1; d <= days; d++){
    const k = `${y}-${pad2(m + 1)}-${pad2(d)}`, n = (byDay[k] || []).length;
    const cls = ['cday', n ? 'on' : '', n > 1 ? 'two' : '', k === todayK ? 'today' : '', k > todayK ? 'future' : '', state.calDay === k ? 'picked' : ''].filter(Boolean).join(' ');
    grid += `<button class="${cls}" data-action="cal-day" data-id="${k}" aria-label="${d}${n ? `, ${n} séance${n > 1 ? 's' : ''}` : ''}">${d}</button>`;
  }
  let info = '';
  if (state.calDay){
    const list = byDay[state.calDay] || [];
    const label = keyDate(state.calDay).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
    info = `<p class="cal-info"><b>${h(label.charAt(0).toUpperCase() + label.slice(1))}</b>${list.length ? h(list.map(s => s.programName || (prog(s.program) || {}).name || 'Séance').join(', ')) : 'Repos'}</p>`;
  }
  return `${statBlocks([['Cette semaine', `${week}<small>séance${week > 1 ? 's' : ''}</small>`], ['Ce mois-ci', `${month}<small>séance${month > 1 ? 's' : ''}</small>`], ['D’affilée', `${streak}<small>jour${streak > 1 ? 's' : ''}</small>`]])}
    <div class="cal-nav">
      <button class="icon" data-action="cal-prev" aria-label="Mois précédent">‹</button>
      <span class="cal-t">${h(title.charAt(0).toUpperCase() + title.slice(1))}</span>
      <button class="icon" data-action="cal-next" aria-label="Mois suivant" ${isCurrent ? 'disabled' : ''}>›</button>
    </div>
    <div class="cal">${grid}</div>${info}`;
}

/* Graphiques */
function drawLine(el, pts, o){
  const W = el.clientWidth, H = el.clientHeight;
  if (!W || !H || !pts.length){ el.innerHTML = ''; return; }
  const vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi === lo){ const pad = Math.max(o.minPad || 1, Math.abs(hi) * 0.04); lo -= pad; hi += pad; }
  else { const pad = (hi - lo) * 0.15; lo -= pad; hi += pad; }
  if (Math.min(...vs) >= 0 && lo < 0) lo = 0;
  const pl = 42, pr = 16, pt = 28, pb = 26;
  const iw = W - pl - pr, ih = H - pt - pb;
  const X = i => pts.length === 1 ? pl + iw / 2 : pl + iw * i / (pts.length - 1);
  const Y = v => pt + ih * (1 - (v - lo) / (hi - lo));
  const rng = hi - lo;
  const tick = v => o.tick ? o.tick(v, hi) : fmt(rng > 6 ? Math.round(v) : rng > 1 ? Math.round(v * 10) / 10 : Math.round(v * 100) / 100);
  const lastV = vs[vs.length - 1];
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(o.aria)}">`;
  for (let k = 0; k < 3; k++){
    const v = lo + rng * k / 2, y = Y(v).toFixed(1);
    s += `<line class="g" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text x="${pl - 8}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${tick(v)}</text>`;
  }
  if (pts.length > 1) s += `<path class="ln" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('')}"/>`;
  const r = pts.length > 30 ? 2 : 3;
  pts.forEach((p, i) => {
    const isLast = i === pts.length - 1;
    s += `<circle class="${isLast ? 'dl' : 'd'}" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${isLast ? 4.5 : r}"/>`;
  });
  const lx = X(pts.length - 1), ly = Y(lastV);
  s += `<text class="vl" x="${lx.toFixed(1)}" y="${(ly - 11).toFixed(1)}" text-anchor="${pts.length === 1 ? 'middle' : 'end'}">${h(o.label(lastV))}</text>`;
  s += `<text x="${pl}" y="${H - 8}" text-anchor="start">${o.date(pts[0])}</text>`;
  if (pts.length > 1) s += `<text x="${W - pr}" y="${H - 8}" text-anchor="end">${o.date(pts[pts.length - 1])}</text>`;
  el.innerHTML = s + '</svg>';
}
function drawChart(){
  const el = document.getElementById('chart');
  if (el && state.progEx){

    const pts = seriesFor(state.progEx, m.id);

const CHALK = '#ECEAE4', SILVER = '#969AA0', GRAPHITE = '#5A5E63', GOLD = '#D9B45A', PALE = '#F3DA92';
const NUM_WORDS = ['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze'];
const PHRASES = ['Exercice bouclé.', 'Propre. On enchaîne.', 'Une de plus dans la poche.', 'Bien tenu.', 'Solide.',
  'C’est comme ça qu’on progresse.', 'Garde ce rythme.', 'Travail fait.', 'Rien ne t’arrête.', 'Ça, c’est du sérieux.'];

const SAMPLE_FINAL = {programName:'Force', minutes:52, sets:21, volume:6840, records:['Développé couché']};
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.random() * (b - a);
const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

function setScore(sets, useReps){ return useReps ? Math.max(...sets.map(x => x.r)) : Math.max(...sets.map(x => e1rm(x.w, x.r))); }
function isRecord(exId, rawSets, excludeId){
  if (!rawSets.length) return false;
  const sets = effSets(exId, rawSets, new Date().toISOString());
  const prev = state.sessions.filter(s => s.id !== excludeId).flatMap(s => effSets(exId, setsOf(s, exId), s.date));
  if (!prev.length) return false;
  const useReps = prev.concat(sets).every(x => !x.w);
  return setScore(sets, useReps) > setScore(prev, useReps) + 1e-9;
}

const fx = {el:null, stage:null, cv:null, ctx:null, parts:[], raf:0, last:0, W:0, H:0, timers:[], open:false, kind:'', t0:0, boom:0};
function buzz(pattern){
  if (!state.prefs.vibrate || !navigator.vibrate) return;
  try { navigator.vibrate(pattern); } catch(e){}
}
let actx = null;
function primeAudio(){
  if (!state.prefs.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch(e){}
}
function beep(){
  if (!state.prefs.sound) return;
  try {
    primeAudio();
    const t = actx.currentTime;
    [[0, 880], [0.24, 1175]].forEach(([o, f]) => {
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.type = 'sine'; osc.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + o);
      g.gain.exponentialRampToValueAtTime(0.5, t + o + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + o + 0.2);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t + o); osc.stop(t + o + 0.22);
    });
  } catch(e){}
}
function fxInit(){
  fx.el = document.getElementById('fx'); fx.stage = document.getElementById('fx-stage');
  fx.cv = document.getElementById('fx-canvas'); fx.ctx = fx.cv.getContext('2d');
  fx.el.addEventListener('click', e => {
    if (e.target.closest('[data-action]')) return;
    if (fx.kind === 'inter' || Date.now() - fx.t0 > 1500) closeFx();
  });
  window.addEventListener('resize', () => { if (fx.open) fxSize(); });
}
function fxSize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  fx.W = window.innerWidth; fx.H = window.innerHeight;
  fx.cv.width = Math.round(fx.W * dpr); fx.cv.height = Math.round(fx.H * dpr);
  fx.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function later(ms, fn){ fx.timers.push(setTimeout(fn, ms)); }
function openFx(kind, cls, html){
  closeFx(true);
  fx.kind = kind; fx.open = true; fx.t0 = Date.now(); fx.boom = 0;
  fx.el.className = 'fx ' + cls + (reduceMotion() ? ' rm' : '');
  fx.stage.innerHTML = html;
  fx.el.hidden = false;
  document.documentElement.style.overflow = 'hidden';
  fxSize();
}
function closeFx(instant){
  if (!fx.open) return;
  fx.open = false;
  fx.timers.forEach(clearTimeout); fx.timers = [];
  cancelAnimationFrame(fx.raf); fx.raf = 0; fx.parts = [];
  document.documentElement.style.overflow = '';
  const done = () => { if (!fx.open){ fx.el.hidden = true; fx.stage.innerHTML = ''; fx.ctx.clearRect(0, 0, fx.W, fx.H); } };
  if (instant) done(); else { fx.el.classList.add('out'); setTimeout(done, 200); }
}

/* Particules (canvas) */
function spawn(p){
  const life = p.life || 60;
  fx.parts.push(Object.assign({vx:0, vy:0, g:0, drag:1, size:2, alpha:1, rot:0, vr:0, flip:0, vf:0, type:'dot', color:CHALK}, p, {life, max:life}));
  if (!fx.raf){ fx.last = performance.now(); fx.raf = requestAnimationFrame(tick); }
}
function tick(now){
  const dt = Math.min(2.5, (now - fx.last) / 16.67); fx.last = now;
  const c = fx.ctx; c.clearRect(0, 0, fx.W, fx.H);
  const cur = fx.parts; fx.parts = [];
  for (const p of cur){
    const dr = Math.pow(p.drag, dt);
    p.vx *= dr; p.vy = p.vy * dr + p.g * dt;
    const px = p.x, py = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.flip += p.vf * dt; p.life -= dt;
    if (p.type === 'rocket' && (p.vy > -1.2 || p.y <= p.ty)){ explode(p.x, p.y, p.palette); continue; }
    if (p.life <= 0 || p.y > fx.H + 40) continue;
    fx.parts.push(p);
    c.globalAlpha = p.alpha * (p.type === 'conf' ? Math.min(1, p.life / 25) : Math.max(0, p.life / p.max));
    if (p.type === 'dot'){
      c.fillStyle = p.color; c.beginPath(); c.arc(p.x, p.y, p.size, 0, 6.2832); c.fill();
    } else if (p.type === 'puff'){
      const r = p.size * (1.7 - 0.7 * p.life / p.max);
      const gr = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      gr.addColorStop(0, p.color); gr.addColorStop(1, 'rgba(236,234,228,0)');
      c.fillStyle = gr; c.beginPath(); c.arc(p.x, p.y, r, 0, 6.2832); c.fill();
    } else if (p.type === 'conf'){
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.scale(1, Math.cos(p.flip));
      c.fillStyle = p.color; c.fillRect(-p.size / 2, -p.size * 0.8, p.size, p.size * 1.6); c.restore();
    } else {
      c.strokeStyle = p.color; c.lineWidth = p.size; c.lineCap = 'round';
      c.beginPath(); c.moveTo(px - p.vx * 1.6, py - p.vy * 1.6); c.lineTo(p.x, p.y); c.stroke();
    }
  }
  c.globalAlpha = 1;
  fx.raf = fx.parts.length ? requestAnimationFrame(tick) : 0;
}

function playInter(style, info){
  const phrase = info.record ? `Nouveau record sur ${info.exName} !` : pick(PHRASES);
  const rec = info.record ? ' rec' : '';
  const next = `<p class="fx-next">Suivant<b>${h(info.nextName)}</b>${h(info.nextTarget)}</p>`;
  const rm = reduceMotion();
  if (style === 'chalk'){
    openFx('inter', 'fx-chalk' + rec, `<p class="fx-phrase">${h(phrase)}</p><span class="chalk-line"></span>${next}`);
    if (!rm){
      const r = fx.stage.querySelector('.fx-phrase').getBoundingClientRect();
      const cy = r.top + r.height / 2;
      later(60, () => chalkBurst(fx.W / 2, cy));
      later(60, () => buzz([70, 25, 45, 25, 25]));
      later(320, () => chalkDrift(fx.W / 2, cy, Math.min(fx.W, 420) / 2));
    }
    later(3000, () => closeFx());
  } else if (style === 'slam'){
    const words = info.record ? ['Record', 'battu\u00a0!'] : (info.done === 1 ? ['Et', 'd’un.'] : ['Et', 'de', (NUM_WORDS[info.done] || info.done) + '.']);
    const impacts = words.map((w, k) => `fx-shake .16s ease-out ${(0.21 + k * 0.16).toFixed(2)}s`).join(',');
    words.forEach((w, k) => later(Math.round((0.21 + k * 0.16) * 1000), () => buzz(k === words.length - 1 ? 45 : 28)));
    const end = 0.05 + (words.length - 1) * 0.16 + 0.26;
    openFx('inter', 'fx-slam' + rec, `<span class="slam-bg" aria-hidden="true">${info.done}</span>
      <p class="slam-l" style="animation:${impacts}">${words.map((w, k) => `<span class="w" style="--d:${k}">${h(w)}</span>`).join(' ')}</p>
      <span class="slam-bar" style="--bar:${(end + 0.08).toFixed(2)}s"></span>
      <div style="--nxt:${(end + 0.2).toFixed(2)}s" class="fx-slam-next">${next}</div>`);
    later(3000, () => closeFx());
  } else {
    const C = 2 * Math.PI * 50, n = Math.max(1, info.total);
    const from = Math.max(0, info.done - 1) / n, to = Math.min(n, info.done) / n;
    let ticks = '';
    if (n > 1) for (let k = 0; k < n; k++){
      const a = k / n * 2 * Math.PI;
      ticks += `<line x1="${(60 + 44 * Math.cos(a)).toFixed(2)}" y1="${(60 + 44 * Math.sin(a)).toFixed(2)}" x2="${(60 + 56 * Math.cos(a)).toFixed(2)}" y2="${(60 + 56 * Math.sin(a)).toFixed(2)}"/>`;
    }
    openFx('inter', 'fx-ring' + rec, `<div class="ring-wrap"><span class="ring-pulse"></span>
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-bg" cx="60" cy="60" r="50"/>
          <circle class="ring-fg" cx="60" cy="60" r="50" style="stroke-dasharray:${C.toFixed(2)};stroke-dashoffset:${(C * (1 - to)).toFixed(2)};--o1:${(C * (1 - from)).toFixed(2)};--o2:${(C * (1 - to)).toFixed(2)}"/>
          <g class="ring-ticks">${ticks}</g></svg>
        <div class="ring-num"><b id="ring-n">${rm ? info.done : Math.max(0, info.done - 1)}</b><small>sur ${n} exercices</small></div>
      </div>
      <p class="fx-phrase">${h(phrase)}</p>${next}`);
    if (!rm) later(740, () => { const b = document.getElementById('ring-n'); if (b){ b.textContent = info.done; b.classList.add('pop'); } });
    later(rm ? 100 : 740, () => buzz(info.record ? [50, 60, 50] : 50));
    later(3000, () => closeFx());
  }
}

function countUps(delayMs){
  fx.stage.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, tonnes = el.dataset.fmt === 'vol' && to >= 1000;
    const f = v => tonnes ? fmt(Math.round(v / 100) / 10) : fmt(Math.round(v));
    if (reduceMotion()){ el.textContent = f(to); return; }
    later(delayMs, () => {
      const t0 = performance.now(), dur = 950;
      const step = now => {
        if (!fx.open) return;
        const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = f(to * e);
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  });
}

function playFinal(style, s){

function maybeInter(from){
  const d = state.draft;
  if (!d || state.prefs.inter === 'none' || !d.items[from] || !d.items[from].sets.length) return;
  d.cheered = d.cheered || [];
  if (d.cheered.includes(from)) return;
  d.cheered.push(from); saveDraft();
  const items = d.plan.items, nx = items[d.idx];
  const done = d.items.filter(x => x.sets.length).length;
  playInter(state.prefs.inter, {
    done:Math.max(1, done), total:items.length, exName:exName(items[from].ex),
    nextName:exName(nx.ex), nextTarget:`${nx.sets} × ${nx.label || nx.reps}`,
    record:isRecord(items[from].ex, d.items[from].sets, d.id),
  });
}

/* ---------- Rendu ---------- */
let lastView = null;
function render(){
  if (state.view === 'session' && !state.draft) state.view = 'programs';
  if ((state.view === 'editor' || state.view === 'picker') && !state.edit) state.view = 'programs';
  if (state.view === 'newex' && (!state.newEx || !state.edit)) state.view = state.edit ? 'editor' : 'programs';
  const top = document.getElementById('topbar');
  top.hidden = !!PARENT[state.view];
  for (const t of top.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.id === state.view));
  const v = document.getElementById('view');
  const views = {session:viewSession, editor:viewEditor, picker:viewPicker, newex:viewNewEx, progress:viewProgress, programs:viewPrograms, settings:viewSettings};
  v.innerHTML = (views[state.view] || viewPrograms)();
  state.flash = null; state.slide = null;
  if (state.view === 'progress') drawChart();
  syncWake();
  if (lastView !== state.view){ window.scrollTo(0, 0); lastView = state.view; }
  if (state.scrollEnd){ state.scrollEnd = false; window.scrollTo(0, document.body.scrollHeight); }
}

/* ---------- Écran allumé pendant la séance ---------- */
let wakeLock = null, wakeBusy = false;
async function syncWake(){
  if (wakeBusy) return;
  const want = state.view === 'session' && !!state.draft && state.prefs.wake && document.visibilityState === 'visible';
  wakeBusy = true;
  try {
    if (want && !wakeLock && navigator.wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock){
      const l = wakeLock; wakeLock = null; await l.release();
    }
  } catch(e){ wakeLock = null; }
  wakeBusy = false;
}
document.addEventListener('visibilitychange', syncWake);

/* ---------- Actions : séance ---------- */
function goNext(){
  const d = state.draft;
  if (!d || d.idx >= d.plan.items.length - 1) return;
  const from = d.idx; d.idx++; state.confirm = null; state.slide = 'l';
  saveDraft(); render(); maybeInter(from);
}
function goPrev(){
  const d = state.draft;
  if (!d || d.idx <= 0) return;
  d.idx--; state.confirm = null; state.slide = 'r';
  saveDraft(); render();
}
function startSession(pid){
  const p = prog(pid);
  if (!p) return;
  state.draft = {id:newId('s'), program:pid, plan:{name:p.name, rest:restOf(p), items:clone(p.items)}, startedAt:Date.now(), idx:0,
    items:p.items.map(it => ({ex:it.ex, sets:[]})), inputs:{}, lastSetAt:null};
  saveDraft();
  state.openProgram = null;
  setView('session');
}
function stepInput(f, dir, step){
  const d = state.draft, inp = inputsFor(d.idx);
  const el = document.getElementById('in-' + f);
  let cur = parseNum(el.value); if (isNaN(cur)) cur = inp[f] || 0;
  const nv = f === 'w' ? Math.min(1000, Math.max(0, round2(cur + dir * step))) : Math.min(200, Math.max(1, Math.round(cur) + dir));
  inp[f] = nv; el.value = fmt(nv); saveDraft();
}
function addSet(){
  const d = state.draft, inp = inputsFor(d.idx);
  const wEl = document.getElementById('in-w'), rEl = document.getElementById('in-r');
  const w = parseNum(wEl.value), r = parseInt(rEl.value, 10);
  if (isNaN(w) || w < 0 || w > 1000){ wEl.focus(); toast('Indique une charge valide'); return false; }
  if (isNaN(r) || r < 1 || r > 200){ rEl.focus(); toast('Indique un nombre de répétitions'); return false; }
  inp.w = round2(w); inp.r = r;
  const sets = d.items[d.idx].sets;
  sets.push({w:inp.w, r});
  state.flash = sets.length - 1;
  d.lastSetAt = Date.now();
  primeAudio();
  saveDraft();
  return true;
}
function finishSession(){
  const d = state.draft;
  const items = d.items.filter(it => it.sets.length).map(it => ({ex:it.ex, name:exName(it.ex), sets:it.sets.map(s => ({w:s.w, r:s.r}))}));
  state.draft = null; LS.del(K.draft);
  if (!items.length){ setView('programs'); render(); toast('Séance vide, rien n’a été enregistré'); return; }
  const s = {id:d.id, date:new Date().toISOString(), program:d.program, programName:d.plan.name,
    minutes:Math.max(1, Math.round((Date.now() - d.startedAt) / 60000)), items};
  const records = items.filter(it => isRecord(it.ex, it.sets, s.id)).map(it => it.name);
  state.sessions.push(s); persist();
  state.openSession = s.id;
  state.progEx = items[0].ex; state.metric = defaultMetric(items[0].ex); state.progTab = 'ex';
  setView('progress'); render();
  if (state.prefs.final === 'none') toast('Séance enregistrée');
  else playFinal(state.prefs.final, {programName:s.programName, minutes:s.minutes,
    sets:items.reduce((a, it) => a + it.sets.length, 0),
    volume:items.reduce((a, it) => a + volumeOf(it.ex, it.sets, s.date), 0), records});
}

/* ---------- Actions : programmes ---------- */
function openEditor(id){
  const p = id ? prog(id) : null;
  state.edit = p ? {id:p.id, name:p.name, desc:p.desc || '', rest:restOf(p), items:clone(p.items), isNew:false}
                 : {id:null, name:'', desc:'', rest:90, items:[], isNew:true};
  setView('editor');
}
function saveEditor(){
  const e = state.edit;
  const nameEl = document.getElementById('ed-name');
  const name = (nameEl ? nameEl.value : e.name).trim();
  if (!name){ if (nameEl) nameEl.focus(); toast('Donne un nom au programme'); return false; }
  if (!e.items.length){ toast('Ajoute au moins un exercice'); return false; }
  const p = {id:e.id || newId('p'), name, rest:e.rest || 90, items:e.items};
  if (e.desc) p.desc = e.desc;
  const i = state.programs.findIndex(x => x.id === p.id);
  if (i >= 0) state.programs[i] = p; else state.programs.push(p);
  persistPrograms();
  state.openProgram = p.id;
  state.edit = null;
  setView('programs');
  toast(e.isNew ? 'Programme créé' : 'Programme enregistré');
  return true;
}
function addToEdit(exId){
  const ex = exInfo(exId);
  state.edit.items.push({ex:exId, sets:3, reps:10});
