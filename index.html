<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Carnet de musculation</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;
  --surface:#141517;
  --raised:#222428;
  --line:#303337;
  --muted:#8F949A;
  --text:#ECEAE4;
  --soft:#C9C7C1;
  --danger:#D47D6E;
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pad:12px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:400 15px/1.4 var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
#app{min-height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.28;cursor:default}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* En-têtes */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;height:46px;padding:0 var(--pad);background:var(--bg);border-bottom:1px solid var(--line)}
.topbar[hidden]{display:none}
.mark{font:700 21px/1 var(--cond)}
.tabs{display:flex;margin-left:auto;height:100%}
.tab{position:relative;height:100%;padding:0 10px;color:var(--muted);font:600 15px/1 var(--sans)}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--text)}
main{flex:1;display:flex;flex-direction:column}
.page{display:flex;flex-direction:column;gap:10px;padding:var(--pad)}
.sub{flex:1;display:flex;flex-direction:column}
.sub .page{padding-top:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;height:46px;padding:0 var(--pad);background:var(--bg)}
.bar .icon{margin-left:-8px;background:transparent}
.bar-t{flex:1;min-width:0;font:600 18px/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-time{margin-left:6px;font:400 13px var(--sans);color:var(--muted)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font:600 15px/1 var(--sans);text-align:center}
.btn.primary{background:var(--text);border-color:var(--text);color:#000}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(212,125,110,.45)}
.btn.wide{width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.icon{flex:none;display:inline-flex;align-items:center;justify-content:center;width:46px;height:44px;border-radius:10px;background:var(--raised);font:500 30px/1 var(--sans)}
.icon.go{background:var(--text);color:#000}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:6px}
.flab{font-size:13px;color:var(--muted)}
.inp{width:100%;height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--text);font:600 20px/1 var(--cond)}
.inp::placeholder{color:var(--muted);font-weight:500}
.inp:focus{outline:none;border-color:var(--text)}
.sel{position:relative;display:block}
.sel select{width:100%;height:46px;padding:0 38px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--text);font:600 20px/1 var(--cond);-webkit-appearance:none;appearance:none}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;border-radius:10px;background:var(--surface)}
.seg button{height:36px;border-radius:8px;color:var(--muted);font:600 13px/1 var(--sans)}
.seg button[aria-checked="true"]{background:var(--text);color:#000}
.note{margin:0;font-size:13px;color:var(--muted)}

/* Programmes */
.resume{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--raised)}
.resume-k{margin:0;font-size:13px;color:var(--muted)}
.resume-t{margin:2px 0 0;font:600 22px/1.1 var(--cond)}
.resume-t span{margin-left:6px;font:400 14px var(--sans);color:var(--muted)}
.resume-actions{display:flex;gap:8px}
.resume-actions .primary{flex:1}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prog{border-radius:14px;background:var(--surface);border:1px solid transparent}
.prog.next{border-color:var(--line)}
.prog-head{width:100%;min-height:64px;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:12px;padding:10px 12px;text-align:left}
.prog-letter{font:700 40px/1 var(--cond);color:var(--muted);text-align:center}
.prog.next .prog-letter,.prog.open .prog-letter{color:var(--text)}
.prog-main{display:flex;flex-direction:column;min-width:0}
.prog-name{font:600 23px/1.1 var(--cond);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-sub{font-size:13px;color:var(--muted)}
.tag{padding:5px 8px;border-radius:6px;border:1px solid var(--text);font:600 12px/1 var(--sans)}
.prog-body{display:flex;flex-direction:column;gap:10px;padding:0 12px 12px}
.exlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.exlist li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.exlist em{font-style:normal;color:var(--muted)}
.tgt{font:600 17px/1.2 var(--cond);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog-actions{display:grid;grid-template-columns:1fr auto;gap:8px}

/* Séance */
.session{flex:1;display:flex;flex-direction:column;gap:8px;padding:0 var(--pad) 10px}
.session .bar{padding:0}
.ex{display:flex;flex-direction:column;gap:2px}
.ex-name{margin:0;font:700 clamp(23px,7.4vw,32px)/1.05 var(--cond)}
.ex-tgt{margin:0;font-size:13px;color:var(--muted)}
.ex-last{margin:0;font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stp{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;height:clamp(62px,15vh,92px);border-radius:12px;background:var(--surface);overflow:hidden}
.stp:focus-within{box-shadow:inset 0 0 0 2px var(--text)}
.stp-b{background:var(--raised);font:400 28px/1 var(--sans)}
.stp-b:active{background:var(--line)}
.stp-v{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;cursor:text}
.stp-v input{width:100%;padding:0;border:0;background:none;color:var(--text);text-align:center;font:600 clamp(31px,9.6vw,54px)/1 var(--cond);font-variant-numeric:tabular-nums}
.stp-v input:focus{outline:none}
.stp-v span{margin-top:2px;font-size:11px;color:var(--muted)}
.validate{width:100%;min-height:clamp(48px,11vh,62px);font-size:16px}
.sets{display:flex;align-items:center;gap:6px;min-height:34px;overflow-x:auto;scrollbar-width:none}
.sets::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 11px;border-radius:999px;background:var(--raised);font:600 17px/1 var(--cond);font-variant-numeric:tabular-nums}
.chip.warn{background:transparent;border:1px solid var(--danger);color:var(--danger);font:600 13px/1 var(--sans)}
.chip.flash{animation:flash .7s ease-out}
@keyframes flash{from{background:var(--text);color:#000}to{background:var(--raised);color:var(--text)}}
.sets-empty{font-size:13px;color:var(--muted)}
.exnav{display:flex;align-items:center;gap:8px}
.rest{flex:1;min-width:0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pos{margin-right:2px;font:600 17px/1 var(--cond);color:var(--muted);font-variant-numeric:tabular-nums}

/* Éditeur de programme */
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.erow{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--surface)}
.erow-top{display:flex;align-items:center;gap:6px}
.erow-name{flex:1;min-width:0;font:600 19px/1.15 var(--cond)}
.mini{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;background:var(--raised);font:500 18px/1 var(--sans)}
.erow-stp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mstp{display:grid;grid-template-columns:40px 1fr 40px;height:46px;border-radius:10px;background:var(--raised);overflow:hidden}
.mstp button{font:400 22px/1 var(--sans)}
.mstp button:active{background:var(--line)}
.mstp output{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);font:600 21px/1 var(--cond);font-variant-numeric:tabular-nums}
.mstp output small{margin-top:1px;font:500 10px/1.2 var(--sans);color:var(--muted)}
.pg{margin:12px 0 2px;font:600 13px/1 var(--sans);color:var(--muted)}
.pick{width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.pick small{flex:none;font-size:12px;color:var(--muted)}

/* Progrès */
.chart{position:relative;height:clamp(150px,32vh,250px);margin:0;border-radius:14px;background:var(--surface);overflow:hidden}
.chart svg{display:block}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--text);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.chart .d{fill:var(--surface);stroke:var(--text);stroke-width:1.75}
.chart .dl{fill:var(--text)}
.chart text{font:500 11px var(--sans);fill:var(--muted)}
.chart .vl{font:600 16px var(--cond);fill:var(--text)}
.cap{margin:-2px 0 0;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{min-width:0;padding:8px 10px;border-radius:12px;background:var(--surface)}
.stat-k{display:block;font-size:12px;color:var(--muted)}
.stat-v{display:block;font:600 23px/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stat-v small{margin-left:2px;font:500 12px var(--sans);color:var(--muted)}
.h2{margin:10px 0 0;font:600 21px/1 var(--cond)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hrow{border-radius:12px;background:var(--surface)}
.hhead{width:100%;display:grid;grid-template-columns:62px 1fr auto;align-items:baseline;gap:10px;padding:12px;text-align:left}
.hdate{font-size:13px;color:var(--muted)}
.hprog{min-width:0;font:600 19px/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmeta{font-size:13px;color:var(--muted);white-space:nowrap}
.hbody{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px}
.hex{display:flex;flex-direction:column;padding-top:6px;border-top:1px solid var(--line);font-size:14px}
.hsets{font:500 17px/1.3 var(--cond);color:var(--soft);word-spacing:.35em;font-variant-numeric:tabular-nums}
.hbody .btn{margin-top:4px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px 4px 4px}
.empty-t{margin:0;font:600 26px/1.1 var(--cond)}
.empty p{margin:0;color:var(--muted)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;max-width:calc(100% - 24px);padding:10px 14px;border-radius:10px;background:var(--text);color:#000;font:600 14px/1.2 var(--sans);transform:translate(-50%,-160%);transition:transform .25s ease;pointer-events:none}
.toast.show{transform:translate(-50%,0)}

/* Animation d'ouverture : l'haltère s'assemble */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3vh,22px);background:#000;cursor:pointer;animation:sp-out .32s ease-in 1.32s forwards}
#splash.skip{animation:sp-skip .16s ease-in forwards}
.sp-db{width:min(60vw,52vh,280px);height:auto;overflow:visible;animation:sp-press .42s cubic-bezier(.3,0,.2,1) .86s both}
.sp-db rect{transform-box:fill-box;transform-origin:center}
.sp-g{animation:sp-knock .2s ease-out .5s both}
.sp-bar{fill:#969AA0;animation:sp-bar .34s cubic-bezier(.2,.8,.2,1) both}
.sp-col{fill:#969AA0;animation:sp-col .2s cubic-bezier(.2,1.6,.4,1) .7s both}
.sp-big,.sp-sm{fill:#ECEAE4}
.sp-big.l{animation:sp-in-l .36s cubic-bezier(.2,1.3,.35,1) .2s both}
.sp-big.r{animation:sp-in-r .36s cubic-bezier(.2,1.3,.35,1) .2s both}
.sp-sm.l{animation:sp-in-l .34s cubic-bezier(.2,1.3,.35,1) .4s both}
.sp-sm.r{animation:sp-in-r .34s cubic-bezier(.2,1.3,.35,1) .4s both}
.sp-word{font:700 clamp(28px,9vw,40px)/1 var(--cond);color:#ECEAE4;animation:sp-word .38s cubic-bezier(.2,.8,.2,1) .86s both}
@keyframes sp-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sp-in-l{from{transform:translateX(-24px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes sp-in-r{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes sp-col{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes sp-knock{0%{transform:translateY(0)}35%{transform:translateY(1.4px)}100%{transform:translateY(0)}}
@keyframes sp-press{from{transform:translateY(0)}to{transform:translateY(-8%)}}
@keyframes sp-word{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes sp-out{from{opacity:1}to{opacity:0;visibility:hidden}}
@keyframes sp-skip{from{opacity:1}to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){
  #splash *{animation:none!important}
  #splash{animation:sp-out .3s ease-in .6s forwards}
}

@media (min-width:600px){:root{--pad:20px}}
@media (prefers-reduced-motion:reduce){.chip.flash{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg class="sp-db" viewBox="-40 -26 80 52" xmlns="http://www.w3.org/2000/svg">
    <g class="sp-g">
      <rect class="sp-bar" x="-34" y="-2.6" width="68" height="5.2" rx="2"/>
      <rect class="sp-col" x="-19.4" y="-5.5" width="2.4" height="11" rx="1"/>
      <rect class="sp-col" x="17" y="-5.5" width="2.4" height="11" rx="1"/>
      <rect class="sp-big l" x="-27" y="-22" width="7" height="44" rx="2.4"/>
      <rect class="sp-big r" x="20" y="-22" width="7" height="44" rx="2.4"/>
      <rect class="sp-sm l" x="-33.5" y="-14" width="5" height="28" rx="2"/>
      <rect class="sp-sm r" x="28.5" y="-14" width="5" height="28" rx="2"/>
    </g>
  </svg>
  <span class="sp-word">Carnet</span>
</div>
<div id="app">
  <header class="topbar" id="topbar">
    <span class="mark">Carnet</span>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-action="tab" data-id="programs">Programmes</button>
      <button class="tab" role="tab" data-action="tab" data-id="progress">Progrès</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

/* ---------- Stockage local ---------- */
const K = {sessions:'carnet.v1.sessions', draft:'carnet.v1.draft', programs:'carnet.v1.programs', customEx:'carnet.v1.customEx'};
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('Stockage plein ou indisponible'); } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};
const clone = o => JSON.parse(JSON.stringify(o));
const validSession = s => !!s && typeof s.id === 'string' && typeof s.date === 'string' && Array.isArray(s.items)
  && s.items.every(it => it && typeof it.ex === 'string' && Array.isArray(it.sets));
const validProgram = p => !!p && typeof p.id === 'string' && typeof p.name === 'string' && Array.isArray(p.items)
  && p.items.every(it => it && typeof it.ex === 'string' && it.sets > 0 && it.reps > 0);

const state = {
  view:'programs', openProgram:null, draft:null,
  programs:null, customEx:{}, sessions:[],
  progEx:null, metric:'e1rm', openSession:null, confirm:null, flash:null,
  edit:null, pickQuery:'', newEx:null, scrollEnd:false,
};
{
  const ps = LS.get(K.programs, null);
  state.programs = Array.isArray(ps) ? ps.filter(validProgram) : clone(DEFAULT_PROGRAMS);
  if (!Array.isArray(ps)) LS.set(K.programs, state.programs);
  const cx = LS.get(K.customEx, {});
  state.customEx = cx && typeof cx === 'object' && !Array.isArray(cx) ? cx : {};
  state.sessions = (LS.get(K.sessions, []) || []).filter(validSession);
}

const prog = id => state.programs.find(p => p.id === id);
const exInfo = id => EX[id] || state.customEx[id] || null;
const persist = () => LS.set(K.sessions, state.sessions);
const persistPrograms = () => LS.set(K.programs, state.programs);
const persistCustomEx = () => LS.set(K.customEx, state.customEx);
const saveDraft = () => { if (state.draft) LS.set(K.draft, state.draft); };

function loadDraft(){
  const d = LS.get(K.draft, null);
  if (!d || !Array.isArray(d.items)) return null;
  if (!d.plan){ const p = prog(d.program); if (!p) return null; d.plan = {name:p.name, items:clone(p.items)}; }
  if (!Array.isArray(d.plan.items) || d.plan.items.length !== d.items.length) return null;
  d.inputs = d.inputs || {};
  return d;
}
state.draft = loadDraft();

/* ---------- Utilitaires ---------- */
const h = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const round2 = n => Math.round(n * 100) / 100;
const parseNum = v => parseFloat(String(v).replace(',', '.').replace(/[^\d.\-]/g, ''));
const fmt = n => Number(n).toLocaleString('fr-FR', {maximumFractionDigits:2});
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const e1rm = (w, r) => r <= 0 ? 0 : (r === 1 ? w : w * (1 + r / 30));
const sorted = () => state.sessions.slice().sort((a, b) => a.date.localeCompare(b.date));
const letter = name => (String(name).trim().charAt(0) || '?').toUpperCase();

function exName(id){
  const e = exInfo(id); if (e) return e.name;
  for (const s of state.sessions) for (const it of s.items) if (it.ex === id && it.name) return it.name;
  return 'Exercice';
}
function fmtSet(s, bw){
  if (bw) return s.w > 0 ? `+${fmt(s.w)}×${s.r}` : `${s.r} reps`;
  return `${fmt(s.w)}×${s.r}`;
}
function lastLine(sets, bw){
  const groups = [];
  for (const s of sets){
    const g = groups[groups.length - 1];
    if (g && g.w === s.w) g.r.push(s.r); else groups.push({w:s.w, r:[s.r]});
  }
  return groups.map(g => (bw && g.w === 0 ? 'PDC' : (bw ? '+' : '') + fmt(g.w) + ' kg') + ' : ' + g.r.join(', ')).join(' / ');
}
function lastPerf(exId, excludeId){
  const list = sorted();
  for (let i = list.length - 1; i >= 0; i--){
    const s = list[i];
    if (s.id === excludeId) continue;
    const sets = s.items.filter(it => it.ex === exId).flatMap(it => it.sets);
    if (sets.length) return sets;
  }
  return null;
}
function daysAgo(t){
  const a = new Date(t); a.setHours(0,0,0,0);
  const b = new Date(); b.setHours(0,0,0,0);
  return Math.round((b - a) / 86400000);
}
function lastDoneTime(pid){
  let t = -Infinity;
  for (const s of state.sessions) if (s.program === pid) t = Math.max(t, Date.parse(s.date));
  return t;
}
function lastDoneLabel(pid){
  const t = lastDoneTime(pid);
  if (t === -Infinity) return 'Jamais faite';
  const d = daysAgo(t);
  if (d <= 0) return 'Faite aujourd’hui';
  if (d === 1) return 'Faite hier';
  return `Faite il y a ${d} jours`;
}
function suggestNext(){
  let best = null, bt = Infinity;
  for (const p of state.programs){ const t = lastDoneTime(p.id); if (t < bt){ bt = t; best = p.id; } }
  return best;
}
function elapsed(start){
  const m = Math.max(0, Math.floor((Date.now() - start) / 60000));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;
}
function restText(d){
  if (!d || !d.lastSetAt) return '';
  const s = Math.floor((Date.now() - d.lastSetAt) / 1000);
  if (s > 900) return '';
  return `Repos ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
const dateShort = iso => new Date(iso).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
const dateTiny = iso => new Date(iso).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
const volFmt = v => v >= 1000 ? `${fmt(Math.round(v / 100) / 10)} t` : `${fmt(Math.round(v))} kg`;

/* ---------- Toast, confirmations, navigation ---------- */
let toastT, confirmT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
function arm(key){
  state.confirm = key;
  clearTimeout(confirmT);
  confirmT = setTimeout(() => { if (state.confirm === key){ state.confirm = null; render(); } }, 3500);
}

// Le bouton retour d'Android revient à l'écran parent au lieu de fermer l'appli
try { history.scrollRestoration = 'manual'; } catch(e){}
const PARENT = {session:'programs', editor:'programs', picker:'editor', newex:'picker'};
let guarded = false, ignorePop = false;
function setView(v){
  state.view = v;
  if (PARENT[v] && !guarded){ try { history.pushState({carnet:1}, ''); guarded = true; } catch(e){} }
  else if (!PARENT[v] && guarded){ guarded = false; ignorePop = true; try { history.back(); } catch(e){ ignorePop = false; } }
}
window.addEventListener('popstate', () => {
  if (ignorePop){ ignorePop = false; return; }
  guarded = false;
  const parent = PARENT[state.view];
  if (!parent) return;
  if (state.view === 'editor') state.edit = null;
  if (state.view === 'newex') state.newEx = null;
  state.confirm = null;
  setView(parent);
  render();
});

  }

          '</ol>' +
          (d ? '<p class="note">Termine ou abandonne la séance en cours pour en commencer une autre.</p>' : '') +
          `<div class="prog-actions">${d ? '<span></span>' : `<button class="btn primary" data-action="start" data-id="${h(p.id)}">Commencer</button>`}

          '</div>';
      }
      out += '</li>';

    out += '</ul>';
  } else {
    out += '<div class="empty"><p class="empty-t">Aucun programme</p><p>Crée ton premier programme ou réinstalle ceux d’origine.</p></div>';
  }

  }
  return out + '</div>';
}

/* ---------- Vue : séance ---------- */
function inputsFor(i){
  const d = state.draft;
  if (d.inputs[i]) return d.inputs[i];
  const it = d.plan.items[i], ex = exInfo(it.ex) || {step:2.5, start:0}, cur = d.items[i];
  let w = ex.start, r = it.reps;
  if (cur.sets.length){ const l = cur.sets[cur.sets.length - 1]; w = l.w; r = l.r; }
  else { const lp = lastPerf(it.ex, d.id); if (lp && lp.length){ w = lp[0].w; r = lp[0].r; } }
  return (d.inputs[i] = {w, r});
}
function stepper(f, val, label, step, what){
  return `<div class="stp">
    <button class="stp-b" data-action="dec" data-f="${f}" data-step="${step}" aria-label="Diminuer ${what}">−</button>
    <label class="stp-v"><input id="in-${f}" data-f="${f}" inputmode="${f === 'w' ? 'decimal' : 'numeric'}" enterkeyhint="done" autocomplete="off" value="${fmt(val)}" aria-label="${h(label)}"><span>${h(label)}</span></label>
    <button class="stp-b" data-action="inc" data-f="${f}" data-step="${step}" aria-label="Augmenter ${what}">+</button>
  </div>`;
}
function viewSession(){
  const d = state.draft, items = d.plan.items, i = d.idx;
  const it = items[i], ex = exInfo(it.ex) || {name:exName(it.ex), step:2.5, start:0}, cur = d.items[i];
  const inp = inputsFor(i);
  const last = lastPerf(it.ex, d.id);
  const reached = cur.sets.length >= it.sets;
  const isLast = i === items.length - 1;
  const allDone = d.items.every((x, k) => x.sets.length >= items[k].sets);
  const tgt = [`Objectif ${it.sets} × ${it.label || it.reps}`, it.hint, ex.unit].filter(Boolean).join(', ');
  return `<div class="session">
    <header class="bar">
      <button class="icon" data-action="leave" aria-label="Retour aux programmes">‹</button>
      <span class="bar-t">${h(d.plan.name)}<span class="bar-time" id="elapsed">${elapsed(d.startedAt)}</span></span>
      <button class="btn small ${state.confirm === 'finish' || allDone ? 'primary' : ''}" data-action="finish">${state.confirm === 'finish' ? 'Confirmer' : 'Terminer'}</button>
    </header>
    <div class="ex">
      <h1 class="ex-name">${h(ex.name)}</h1>
      <p class="ex-tgt">${h(tgt)}</p>

    </div>
    <div class="controls">
      <div class="steppers">
        ${stepper('w', inp.w, ex.bw ? 'kg de lest' : 'kg', ex.step, 'la charge')}
        ${stepper('r', inp.r, 'reps', 1, 'les répétitions')}
      </div>
      <button class="btn primary validate" data-action="add-set">Valider la série ${cur.sets.length + 1}</button>
      <div class="sets" aria-label="Séries validées">${cur.sets.length
        ? cur.sets.map((s, k) => `<button class="chip ${state.confirm === 'rm' + k ? 'warn' : ''} ${state.flash === k ? 'flash' : ''}" data-action="rm-set" data-k="${k}" aria-label="Série ${k + 1}, ${h(fmtSet(s, ex.bw))}, toucher pour retirer">${state.confirm === 'rm' + k ? 'Retirer ?' : h(fmtSet(s, ex.bw))}</button>`).join('')
        : '<span class="sets-empty">Aucune série pour l’instant</span>'}</div>
      <nav class="exnav" aria-label="Exercices">
        <span class="rest" id="rest">${restText(d)}</span>
        <span class="pos">${i + 1} / ${items.length}</span>
        <button class="icon" data-action="prev" ${i === 0 ? 'disabled' : ''} aria-label="Exercice précédent">‹</button>
        <button class="icon ${reached && !isLast ? 'go' : ''}" data-action="next" ${isLast ? 'disabled' : ''} aria-label="Exercice suivant">›</button>
      </nav>
    </div>
  </div>`;
}

/* ---------- Vue : progrès ---------- */
const metricObj = () => METRICS.find(m => m.id === state.metric) || METRICS[0];
function defaultMetric(exId){
  const sets = state.sessions.flatMap(s => s.items.filter(it => it.ex === exId).flatMap(it => it.sets));
  return sets.length && sets.every(s => !s.w) ? 'reps' : 'e1rm';
}
function seriesFor(exId, metric){
  return sorted().map(s => {
    const sets = s.items.filter(it => it.ex === exId).flatMap(it => it.sets);
    if (!sets.length) return null;
    let v;
    if (metric === 'e1rm') v = Math.max(...sets.map(x => e1rm(x.w, x.r)));
    else if (metric === 'max') v = Math.max(...sets.map(x => x.w));
    else if (metric === 'vol') v = sets.reduce((a, x) => a + x.w * x.r, 0);
    else v = Math.max(...sets.map(x => x.r));
    return {iso:s.date, v:Math.round(v * 10) / 10};
  }).filter(Boolean);
}
function metricHtml(v, m){
  if (m.id === 'vol'){ const t = volFmt(v).split(' '); return `${t[0]}<small>${t[1]}</small>`; }
  return `${fmt(Math.round(v * 10) / 10)}<small>${m.unit}</small>`;
}
function backupBlock(){
  return `<h2 class="h2">Sauvegarde</h2>
    <p class="note">Tes séances et tes programmes sont enregistrés sur ce téléphone. Exporte une sauvegarde de temps en temps pour ne rien perdre.</p>
    <div class="row2"><button class="btn" data-action="export">Exporter</button><button class="btn ghost" data-action="import">Importer</button></div>`;
}
function viewProgress(){
  const list = sorted();
  if (!list.length){
    return `<div class="page"><div class="empty">
      <p class="empty-t">Pas encore de séance</p>
      <p>Ta progression s’affichera ici dès ta première séance terminée.</p>
      <button class="btn primary" data-action="tab" data-id="programs">Choisir un programme</button>
    </div>${backupBlock()}</div>`;
  }
  const used = new Set(list.flatMap(s => s.items.filter(it => it.sets.length).map(it => it.ex)));
  const order = allExEntries().map(e => e.id);
  const exIds = order.filter(id => used.has(id)).concat([...used].filter(id => !order.includes(id)));
  if (!state.progEx || !exIds.includes(state.progEx)){
    const lastS = list[list.length - 1];
    state.progEx = (lastS.items.find(it => it.sets.length) || {}).ex || exIds[0];
    state.metric = defaultMetric(state.progEx);
  }
  const m = metricObj();
  const pts = seriesFor(state.progEx, m.id);
  const vals = pts.map(p => p.v);
  const best = Math.max(...vals), last = vals[vals.length - 1], diff = last - vals[0];
  const evo = pts.length > 1 ? (diff >= 0 ? '+' : '−') + metricHtml(Math.abs(diff), m) : '—';
  const info = exInfo(state.progEx);
  const bwNote = info && info.bw && m.id !== 'reps' ? ' Ici, la charge correspond au lest.' : '';

  let out = `<div class="page">
    <label class="sel"><span class="vh">Exercice</span><select id="ex-select">${exIds.map(id => `<option value="${h(id)}" ${id === state.progEx ? 'selected' : ''}>${h(exName(id))}</option>`).join('')}</select></label>
    <div class="seg" role="radiogroup" aria-label="Mesure affichée">${METRICS.map(x => `<button role="radio" aria-checked="${x.id === m.id}" data-action="metric" data-id="${x.id}">${x.short}</button>`).join('')}</div>
    <figure class="chart" id="chart"></figure>
    <p class="cap">${h(m.cap + bwNote)}</p>
    <div class="stats">
      <div class="stat"><span class="stat-k">Record</span><span class="stat-v">${metricHtml(best, m)}</span></div>
      <div class="stat"><span class="stat-k">Dernière</span><span class="stat-v">${metricHtml(last, m)}</span></div>
      <div class="stat"><span class="stat-k">Évolution</span><span class="stat-v">${evo}</span></div>
    </div>
    <h2 class="h2">Historique</h2>
    <ul class="hist">`;
  for (const s of list.slice().reverse()){
    const name = s.programName || (prog(s.program) || {}).name || 'Séance';
    const open = state.openSession === s.id;
    const nsets = s.items.reduce((a, it) => a + it.sets.length, 0);
    const vol = s.items.reduce((a, it) => a + it.sets.reduce((b, x) => b + x.w * x.r, 0), 0);
    out += `<li class="hrow">
      <button class="hhead" data-action="toggle-sess" data-id="${h(s.id)}" aria-expanded="${open}">
        <span class="hdate">${dateShort(s.date)}</span>
        <span class="hprog">${h(name)}</span>
        <span class="hmeta">${nsets} série${nsets > 1 ? 's' : ''}, ${volFmt(vol)}</span>
      </button>`;
    if (open){
      out += '<div class="hbody">' + s.items.map(it => {
        const bw = (exInfo(it.ex) || {}).bw;
        return `<div class="hex"><span>${h(it.name || exName(it.ex))}</span><span class="hsets">${it.sets.map(x => h(fmtSet(x, bw))).join(' ')}</span></div>`;
      }).join('') +
      `<button class="btn ghost danger" data-action="del-sess" data-id="${h(s.id)}">${state.confirm === 'del' + s.id ? 'Confirmer la suppression' : 'Supprimer la séance'}</button></div>`;
    }
    out += '</li>';
  }
  return out + '</ul>' + backupBlock() + '</div>';
}

function drawChart(){
  const el = document.getElementById('chart');
  if (!el || !state.progEx) return;
  const m = metricObj();
  const pts = seriesFor(state.progEx, m.id);
  const W = el.clientWidth, H = el.clientHeight;
  if (!W || !H || !pts.length){ el.innerHTML = ''; return; }
  const vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi === lo){ const pad = Math.max(1, Math.abs(hi) * 0.08); lo -= pad; hi += pad; }
  else { const pad = (hi - lo) * 0.15; lo -= pad; hi += pad; }
  if (Math.min(...vs) >= 0 && lo < 0) lo = 0;
  const pl = 42, pr = 16, pt = 28, pb = 26;
  const iw = W - pl - pr, ih = H - pt - pb;
  const X = i => pts.length === 1 ? pl + iw / 2 : pl + iw * i / (pts.length - 1);
  const Y = v => pt + ih * (1 - (v - lo) / (hi - lo));
  const tick = v => m.id === 'vol' && hi >= 1000 ? fmt(Math.round(v / 100) / 10) + ' t' : fmt(hi - lo > 6 ? Math.round(v) : Math.round(v * 10) / 10);
  const lastV = vs[vs.length - 1];
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(exName(state.progEx))}, ${pts.length} séance${pts.length > 1 ? 's' : ''}, dernière valeur ${fmt(lastV)} ${m.unit}">`;
  for (let k = 0; k < 3; k++){
    const v = lo + (hi - lo) * k / 2, y = Y(v).toFixed(1);
    s += `<line class="g" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text x="${pl - 8}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${tick(v)}</text>`;
  }
  if (pts.length > 1){
    s += `<path class="ln" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('')}"/>`;
  }
  const r = pts.length > 30 ? 2 : 3;
  pts.forEach((p, i) => {
    const isLast = i === pts.length - 1;
    s += `<circle class="${isLast ? 'dl' : 'd'}" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${isLast ? 4.5 : r}"/>`;
  });
  const lx = X(pts.length - 1), ly = Y(lastV);
  const lbl = m.id === 'vol' ? volFmt(lastV) : `${fmt(lastV)} ${m.unit}`;
  s += `<text class="vl" x="${lx.toFixed(1)}" y="${(ly - 11).toFixed(1)}" text-anchor="${pts.length === 1 ? 'middle' : 'end'}">${h(lbl)}</text>`;
  s += `<text x="${pl}" y="${H - 8}" text-anchor="start">${dateTiny(pts[0].iso)}</text>`;
  if (pts.length > 1) s += `<text x="${W - pr}" y="${H - 8}" text-anchor="end">${dateTiny(pts[pts.length - 1].iso)}</text>`;
  el.innerHTML = s + '</svg>';
}

/* ---------- Rendu ---------- */
let lastView = null;
function render(){
  if (state.view === 'session' && !state.draft) state.view = 'programs';
  if ((state.view === 'editor' || state.view === 'picker') && !state.edit) state.view = 'programs';
  if (state.view === 'newex' && (!state.newEx || !state.edit)) state.view = state.edit ? 'editor' : 'programs';
  const top = document.getElementById('topbar');
  top.hidden = !!PARENT[state.view];
  for (const t of top.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.id === state.view));
  const v = document.getElementById('view');
  const views = {session:viewSession, editor:viewEditor, picker:viewPicker, newex:viewNewEx, progress:viewProgress, programs:viewPrograms};
  v.innerHTML = (views[state.view] || viewPrograms)();
  state.flash = null;
  if (state.view === 'progress') drawChart();
  if (lastView !== state.view){ window.scrollTo(0, 0); lastView = state.view; }
  if (state.scrollEnd){ state.scrollEnd = false; window.scrollTo(0, document.body.scrollHeight); }
}

/* ---------- Actions : séance ---------- */
function startSession(pid){
  const p = prog(pid);
  if (!p) return;
  state.draft = {id:newId('s'), program:pid, plan:{name:p.name, items:clone(p.items)}, startedAt:Date.now(), idx:0,
    items:p.items.map(it => ({ex:it.ex, sets:[]})), inputs:{}, lastSetAt:null};
  saveDraft();
  state.openProgram = null;
  setView('session');
}
function stepInput(f, dir, step){
  const d = state.draft, inp = inputsFor(d.idx);
  const el = document.getElementById('in-' + f);
  let cur = parseNum(el.value); if (isNaN(cur)) cur = inp[f] || 0;
  const nv = f === 'w' ? Math.min(1000, Math.max(0, round2(cur + dir * step))) : Math.min(200, Math.max(1, Math.round(cur) + dir));
  inp[f] = nv; el.value = fmt(nv); saveDraft();
}
function addSet(){
  const d = state.draft, inp = inputsFor(d.idx);
  const wEl = document.getElementById('in-w'), rEl = document.getElementById('in-r');
  const w = parseNum(wEl.value), r = parseInt(rEl.value, 10);
  if (isNaN(w) || w < 0 || w > 1000){ wEl.focus(); toast('Indique une charge valide'); return false; }
  if (isNaN(r) || r < 1 || r > 200){ rEl.focus(); toast('Indique un nombre de répétitions'); return false; }
  inp.w = round2(w); inp.r = r;
  const sets = d.items[d.idx].sets;
  sets.push({w:inp.w, r});
  state.flash = sets.length - 1;
  d.lastSetAt = Date.now();
  saveDraft();
  return true;
}
function finishSession(){
  const d = state.draft;
  const items = d.items.filter(it => it.sets.length).map(it => ({ex:it.ex, name:exName(it.ex), sets:it.sets.map(s => ({w:s.w, r:s.r}))}));
  state.draft = null; LS.del(K.draft);
  if (!items.length){ setView('programs'); render(); toast('Séance vide, rien n’a été enregistré'); return; }
  const s = {id:d.id, date:new Date().toISOString(), program:d.program, programName:d.plan.name,
    minutes:Math.max(1, Math.round((Date.now() - d.startedAt) / 60000)), items};
  state.sessions.push(s); persist();
  state.openSession = s.id;
  state.progEx = items[0].ex; state.metric = defaultMetric(items[0].ex);
  setView('progress'); render(); toast('Séance enregistrée');
}

/* ---------- Actions : programmes ---------- */
function openEditor(id){
  const p = id ? prog(id) : null;
  state.edit = p ? {id:p.id, name:p.name, desc:p.desc || '', items:clone(p.items), isNew:false}
                 : {id:null, name:'', desc:'', items:[], isNew:true};
  setView('editor');
}
function saveEditor(){
  const e = state.edit;
  const nameEl = document.getElementById('ed-name');
  const name = (nameEl ? nameEl.value : e.name).trim();
  if (!name){ if (nameEl) nameEl.focus(); toast('Donne un nom au programme'); return false; }
  if (!e.items.length){ toast('Ajoute au moins un exercice'); return false; }
  const p = {id:e.id || newId('p'), name, items:e.items};
  if (e.desc) p.desc = e.desc;
  const i = state.programs.findIndex(x => x.id === p.id);
  if (i >= 0) state.programs[i] = p; else state.programs.push(p);
  persistPrograms();
  state.openProgram = p.id;
  state.edit = null;
  setView('programs');
  toast(e.isNew ? 'Programme créé' : 'Programme enregistré');
  return true;
}
function addToEdit(exId){
  const ex = exInfo(exId);
  state.edit.items.push({ex:exId, sets:3, reps:10});
  state.pickQuery = '';
  state.scrollEnd = true;
  setView('editor');
  toast(`${ex ? ex.name : 'Exercice'} ajouté`);
}
function saveNewEx(){
  const n = state.newEx;
  const el = document.getElementById('nx-name');
  const name = (el ? el.value : n.name).trim();
  if (!name){ if (el) el.focus(); toast('Donne un nom à l’exercice'); return; }
  const existing = allExEntries().find(e => norm(e.name) === norm(name));
  state.newEx = null;
  if (existing){ addToEdit(existing.id); return; }
  const id = newId('x');
  state.customEx[id] = {g:n.g, name, step:n.step, start:n.bw ? 0 : 20, bw:n.bw, custom:true};
  persistCustomEx();
  addToEdit(id);
}

/* ---------- Sauvegarde ---------- */
function exportData(){
  const data = {app:'carnet-muscu', version:1, exportedAt:new Date().toISOString(),
    sessions:state.sessions, programs:state.programs, customEx:state.customEx};
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `carnet-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Sauvegarde téléchargée');
}
function importData(text){
  let d;
  try { d = JSON.parse(text); } catch(e){ toast('Ce fichier n’est pas une sauvegarde valide'); return; }
  if (!d || !Array.isArray(d.sessions)){ toast('Ce fichier n’est pas une sauvegarde valide'); return; }
  const ids = new Set(state.sessions.map(s => s.id));
  let added = 0;
  for (const s of d.sessions){
    if (!validSession(s) || ids.has(s.id)) continue;
    const c = clone(s); delete c.synced;
    state.sessions.push(c); ids.add(c.id); added++;
  }
  if (d.customEx && typeof d.customEx === 'object' && !Array.isArray(d.customEx)){
    for (const [id, e] of Object.entries(d.customEx)) if (e && typeof e.name === 'string' && !EX[id]) state.customEx[id] = e;
  }
  if (Array.isArray(d.programs)){
    for (const p of d.programs){
      if (!validProgram(p)) continue;
      const i = state.programs.findIndex(x => x.id === p.id);
      if (i >= 0) state.programs[i] = clone(p); else state.programs.push(clone(p));
    }
  }
  persist(); persistPrograms(); persistCustomEx();
  state.progEx = null;
  render();
  toast(added ? `${added} séance${added > 1 ? 's' : ''} importée${added > 1 ? 's' : ''}` : 'Aucune nouvelle séance dans ce fichier');
}

/* ---------- Événements ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const a = b.dataset.action, id = b.dataset.id, d = state.draft, e = state.edit;
  const prev = state.confirm;
  state.confirm = null; clearTimeout(confirmT);
  const k = b.dataset.k !== undefined ? +b.dataset.k : -1;
  switch (a){
    case 'tab': setView(id); break;
    case 'toggle-prog': state.openProgram = state.openProgram === id ? null : id; break;
    case 'start': if (!d) startSession(id); break;
    case 'resume': if (d) setView('session'); break;
    case 'abandon':
      if (prev === 'abandon'){ state.draft = null; LS.del(K.draft); toast('Séance abandonnée'); }
      else arm('abandon');
      break;
    case 'edit-prog': openEditor(id); break;
    case 'new-prog': openEditor(null); break;
    case 'restore-defaults': {
      const missing = DEFAULT_PROGRAMS.filter(dp => !prog(dp.id)).map(clone);
      state.programs = missing.concat(state.programs); persistPrograms();
      toast('Programmes d’origine réinstallés');
      break;
    }

    case 'leave': setView('programs'); break;
    case 'finish':
      if (prev === 'finish'){ finishSession(); return; }
      arm('finish'); break;
    case 'inc': case 'dec':
      if (d) stepInput(b.dataset.f, a === 'inc' ? 1 : -1, parseFloat(b.dataset.step));
      if (!prev) return;
      break;
    case 'add-set': if (!d || !addSet()) return; break;
    case 'rm-set':
      if (prev === 'rm' + k){ d.items[d.idx].sets.splice(k, 1); delete d.inputs[d.idx]; saveDraft(); }
      else arm('rm' + k);
      break;
    case 'prev': if (d && d.idx > 0){ d.idx--; saveDraft(); } break;
    case 'next': if (d && d.idx < d.plan.items.length - 1){ d.idx++; saveDraft(); } break;

    case 'ed-cancel': state.edit = null; setView('programs'); break;
    case 'ed-save': if (!saveEditor()) return; break;
    case 'ed-add': state.pickQuery = ''; setView('picker'); break;
    case 'ed-inc': case 'ed-dec': {
      const it = e.items[k], f = b.dataset.f, dir = a === 'ed-inc' ? 1 : -1;
      if (f === 'sets') it.sets = Math.min(10, Math.max(1, it.sets + dir));
      else { it.reps = Math.min(50, Math.max(1, it.reps + dir)); delete it.label; }
      const out = b.parentElement.querySelector('output');
      if (out) out.firstChild.nodeValue = String(f === 'sets' ? it.sets : it.reps);
      if (!prev) return;
      break;
    }
    case 'ed-up': if (k > 0){ const t = e.items[k - 1]; e.items[k - 1] = e.items[k]; e.items[k] = t; } break;
    case 'ed-down': if (k < e.items.length - 1){ const t = e.items[k + 1]; e.items[k + 1] = e.items[k]; e.items[k] = t; } break;
    case 'ed-rm': e.items.splice(k, 1); break;
    case 'ed-delete':
      if (prev === 'ed-delete'){
        state.programs = state.programs.filter(p => p.id !== e.id); persistPrograms();
        state.edit = null; setView('programs'); toast('Programme supprimé');
      } else arm('ed-delete');
      break;

    case 'pk-back': setView('editor'); break;
    case 'pk-add': addToEdit(id); break;
    case 'pk-new': state.newEx = {name:state.pickQuery.trim(), g:'Pectoraux', bw:false, step:2.5}; setView('newex'); break;
    case 'nx-back': state.newEx = null; setView('picker'); break;
    case 'nx-type': state.newEx.bw = id === 'bw'; break;
    case 'nx-step': state.newEx.step = parseFloat(id); break;
    case 'nx-save': saveNewEx(); break;

    case 'metric': state.metric = id; break;
    case 'toggle-sess': state.openSession = state.openSession === id ? null : id; break;
    case 'del-sess':
      if (prev === 'del' + id){
        state.sessions = state.sessions.filter(s => s.id !== id); persist();
        if (state.openSession === id) state.openSession = null;
        toast('Séance supprimée');
      } else arm('del' + id);
      break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('import-file').click(); break;
  }
  render();
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if (!el.matches) return;
  if (el.matches('.stp-v input') && state.draft){
    const f = el.dataset.f;
    const v = f === 'w' ? parseNum(el.value) : parseInt(el.value, 10);
    if (!isNaN(v)){ inputsFor(state.draft.idx)[f] = f === 'w' ? round2(v) : v; saveDraft(); }
  } else if (el.id === 'ed-name' && state.edit){
    state.edit.name = el.value;
  } else if (el.id === 'nx-name' && state.newEx){
    state.newEx.name = el.value;
  } else if (el.id === 'pk-q'){
    state.pickQuery = el.value;
    const list = document.getElementById('pk-list'); if (list) list.innerHTML = pickList();
  }
});
document.addEventListener('focusin', ev => {
  if (ev.target.matches && ev.target.matches('.stp-v input')) setTimeout(() => { try { ev.target.select(); } catch(e){} }, 0);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.stp-v input, #ed-name, #nx-name, #pk-q')) ev.target.blur();
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'ex-select'){
    state.progEx = el.value; state.metric = defaultMetric(state.progEx); state.confirm = null; render();
  } else if (el.id === 'nx-group' && state.newEx){
    state.newEx.g = el.value;
  } else if (el.id === 'import-file' && el.files && el.files[0]){
    el.files[0].text().then(importData).catch(() => toast('Lecture du fichier impossible'));
    el.value = '';
  }
});

let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (state.view === 'progress') drawChart(); }, 120); });

setInterval(() => {
  if (state.view !== 'session' || !state.draft) return;
  const r = document.getElementById('rest'); if (r) r.textContent = restText(state.draft);
  const el = document.getElementById('elapsed'); if (el) el.textContent = elapsed(state.draft.startedAt);
}, 1000);

/* ---------- Animation d'ouverture ---------- */
{
  const sp = document.getElementById('splash');
  if (sp){
    const done = () => { if (sp.isConnected) sp.remove(); };
    sp.addEventListener('animationend', e => { if (e.target === sp) done(); });
    sp.addEventListener('click', () => sp.classList.add('skip'));
    setTimeout(done, 2400);
  }
}

/* ---------- Démarrage ---------- */
if (state.draft) setView('session');
render();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
})();
</script>
