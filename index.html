  state.scrollEnd = true;
  setView('editor');
  toast(`${ex ? ex.name : 'Exercice'} ajouté`);
}
function saveNewEx(){
  const n = state.newEx;
  const el = document.getElementById('nx-name');
  const name = (el ? el.value : n.name).trim();
  if (!name){ if (el) el.focus(); toast('Donne un nom à l’exercice'); return; }
  const existing = allExEntries().find(e => norm(e.name) === norm(name));
  state.newEx = null;
  if (existing){ addToEdit(existing.id); return; }
  const id = newId('x');
  state.customEx[id] = {g:n.g, name, step:n.step, start:n.bw ? 0 : 20, bw:n.bw, custom:true};
  persistCustomEx();
  addToEdit(id);
}

/* ---------- Pesées ---------- */
function bwStep(dir){
  const el = document.getElementById('bw-in'); if (!el) return;
  let v = parseNum(el.value); if (isNaN(v)) v = 80;
  v = Math.min(400, Math.max(20, Math.round((v + dir * 0.1) * 10) / 10));
  el.value = fmt(v); state.bwInput = v;
}
function saveWeight(){
  const el = document.getElementById('bw-in');
  const v = el ? parseNum(el.value) : NaN;
  if (isNaN(v) || v < 20 || v > 400){ if (el) el.focus(); toast('Indique un poids valide'); return false; }
  const kg = Math.round(v * 10) / 10, d = dayKey(Date.now());
  const i = state.weights.findIndex(w => w.d === d);
  if (i >= 0) state.weights[i].kg = kg; else state.weights.push({d, kg});
  state.weights.sort((a, b) => a.d.localeCompare(b.d));
  state.bwInput = null;
  persistWeights();
  toast('Pesée enregistrée');
  return true;
}

/* ---------- Sauvegarde ---------- */
function exportData(){
  const data = {app:'carnet-muscu', version:1, exportedAt:new Date().toISOString(),
    sessions:state.sessions, programs:state.programs, customEx:state.customEx, weights:state.weights};
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `carnet-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Sauvegarde téléchargée');
}
function importData(text){
  let d;
  try { d = JSON.parse(text); } catch(e){ toast('Ce fichier n’est pas une sauvegarde valide'); return; }
  if (!d || !Array.isArray(d.sessions)){ toast('Ce fichier n’est pas une sauvegarde valide'); return; }
  const ids = new Set(state.sessions.map(s => s.id));
  let added = 0;
  for (const s of d.sessions){
    if (!validSession(s) || ids.has(s.id)) continue;
    const c = clone(s); delete c.synced;
    state.sessions.push(c); ids.add(c.id); added++;
  }
  if (d.customEx && typeof d.customEx === 'object' && !Array.isArray(d.customEx)){
    for (const [id, e] of Object.entries(d.customEx)) if (e && typeof e.name === 'string' && !EX[id]) state.customEx[id] = e;
  }
  if (Array.isArray(d.programs)){
    for (const p of d.programs){
      if (!validProgram(p)) continue;
      const i = state.programs.findIndex(x => x.id === p.id);
      if (i >= 0) state.programs[i] = clone(p); else state.programs.push(clone(p));
    }
  }
  if (Array.isArray(d.weights)){
    for (const w of d.weights){
      if (!w || typeof w.d !== 'string' || !(w.kg > 0) || state.weights.some(x => x.d === w.d)) continue;
      state.weights.push({d:w.d, kg:w.kg});
    }
    state.weights.sort((a, b) => a.d.localeCompare(b.d));
  }
  persist(); persistPrograms(); persistCustomEx(); persistWeights();
  state.progEx = null;
  render();
  toast(added ? `${added} séance${added > 1 ? 's' : ''} importée${added > 1 ? 's' : ''}` : 'Aucune nouvelle séance dans ce fichier');
}

/* ---------- Événements ---------- */
function edStep(b){
  const e = state.edit, it = e && e.items[+b.dataset.k];
  if (!it) return;
  const f = b.dataset.f, dir = b.dataset.action === 'ed-inc' ? 1 : -1;
  if (f === 'sets') it.sets = Math.min(10, Math.max(1, it.sets + dir));
  else { it.reps = Math.min(50, Math.max(1, it.reps + dir)); delete it.label; }
  const out = b.parentElement.querySelector('output');
  if (out) out.firstChild.nodeValue = String(f === 'sets' ? it.sets : it.reps);
}
function edRest(dir){
  const e = state.edit; if (!e) return;
  e.rest = Math.min(600, Math.max(15, (e.rest || 90) + dir * 15));
  const o = document.getElementById('ed-rest'); if (o) o.textContent = fmtRest(e.rest);
}
function repeatAction(b){
  const a = b.dataset.action;
  if (a === 'inc' || a === 'dec'){ if (state.draft) stepInput(b.dataset.f, a === 'inc' ? 1 : -1, parseFloat(b.dataset.step)); }
  else if (a === 'bw-inc' || a === 'bw-dec') bwStep(a === 'bw-inc' ? 1 : -1);
  else if (a === 'ed-inc' || a === 'ed-dec') edStep(b);
  else if (a === 'ed-rest-inc' || a === 'ed-rest-dec') edRest(a === 'ed-rest-inc' ? 1 : -1);
}

/* Appui long sur + et − : défilement rapide */
let rp = null, suppressClick = false;
function stopRepeat(){ if (rp){ clearTimeout(rp.t); rp = null; } }
document.addEventListener('pointerdown', ev => {
  suppressClick = false;
  const b = ev.target.closest && ev.target.closest('.rep');
  if (!b || b.disabled) return;
  stopRepeat();
  rp = {b, n:0};
  const run = () => {
    if (!rp) return;
    rp.n++; suppressClick = true; repeatAction(b);
    rp.t = setTimeout(run, rp.n > 10 ? 45 : 95);
  };
  rp.t = setTimeout(run, 380);
});
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, stopRepeat));
document.addEventListener('pointerout', ev => { if (rp && ev.target === rp.b) stopRepeat(); });
document.addEventListener('contextmenu', ev => { if (ev.target.closest && ev.target.closest('.rep')) ev.preventDefault(); });

/* Glisser à gauche ou à droite pour changer d'exercice */
let sw = null;
document.addEventListener('touchstart', ev => {
  sw = null;
  if (state.view !== 'session' || fx.open || ev.touches.length !== 1) return;
  if (ev.target.closest && ev.target.closest('input, .sets, .bar')) return;
  const t = ev.touches[0]; sw = {x:t.clientX, y:t.clientY, t:Date.now()};
}, {passive:true});
document.addEventListener('touchend', ev => {
  if (!sw) return;
  const t = ev.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y, dt = Date.now() - sw.t;
  sw = null;
  if (dt < 700 && Math.abs(dx) > 60 && Math.abs(dx) > 1.6 * Math.abs(dy)){
    stopRepeat();
    if (dx < 0) goNext(); else goPrev();
  }
}, {passive:true});

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-action]');
  if (!b || b.disabled) return;
  if (suppressClick && b.classList.contains('rep')){ suppressClick = false; return; }
  const a = b.dataset.action, id = b.dataset.id, d = state.draft, e = state.edit;
  if (a === 'fx-close'){ closeFx(); return; }
  const prev = state.confirm;
  state.confirm = null; clearTimeout(confirmT);
  const k = b.dataset.k !== undefined ? +b.dataset.k : -1;
  switch (a){
    case 'tab': setView(id); break;
    case 'toggle-prog': state.openProgram = state.openProgram === id ? null : id; break;
    case 'start': if (!d) startSession(id); break;
    case 'resume': if (d) setView('session'); break;
    case 'abandon':
      if (prev === 'abandon'){ state.draft = null; LS.del(K.draft); toast('Séance abandonnée'); }
      else arm('abandon');
      break;
    case 'edit-prog': openEditor(id); break;
    case 'new-prog': openEditor(null); break;
    case 'restore-defaults': {
      const missing = DEFAULT_PROGRAMS.filter(dp => !prog(dp.id)).map(clone);
      state.programs = missing.concat(state.programs); persistPrograms();
      toast('Programmes d’origine réinstallés');
      break;
    }

    case 'leave': setView('programs'); break;
    case 'finish':
      if (prev === 'finish'){ finishSession(); return; }
      arm('finish'); break;
    case 'inc': case 'dec':
      if (d) stepInput(b.dataset.f, a === 'inc' ? 1 : -1, parseFloat(b.dataset.step));
      if (!prev) return;
      break;
    case 'add-set': if (!d || !addSet()) return; break;
    case 'rm-set':
      if (prev === 'rm' + k){ d.items[d.idx].sets.splice(k, 1); delete d.inputs[d.idx]; saveDraft(); }
      else arm('rm' + k);
      break;
    case 'prev': goPrev(); return;
    case 'next': goNext(); return;

    case 'del-prog':
      if (prev === 'delp' + id){
        state.programs = state.programs.filter(p => p.id !== id); persistPrograms();
        if (state.openProgram === id) state.openProgram = null;
        toast('Programme supprimé');
      } else arm('delp' + id);
      break;
    case 'pref-inter': state.prefs.inter = id; LS.set(K.prefs, state.prefs); break;
    case 'pref-final': state.prefs.final = id; LS.set(K.prefs, state.prefs); break;
    case 'preview-inter': if (state.prefs.inter !== 'none') playInter(state.prefs.inter, SAMPLE_INTER); if (!prev) return; break;
    case 'preview-final': if (state.prefs.final !== 'none') playFinal(state.prefs.final, SAMPLE_FINAL); if (!prev) return; break;

    case 'ed-cancel': state.edit = null; setView('programs'); break;
    case 'ed-save': if (!saveEditor()) return; break;
    case 'ed-add': state.pickQuery = ''; setView('picker'); break;
    case 'ed-inc': case 'ed-dec': edStep(b); if (!prev) return; break;
    case 'ed-rest-inc': case 'ed-rest-dec': edRest(a === 'ed-rest-inc' ? 1 : -1); if (!prev) return; break;
    case 'ed-up': if (k > 0){ const t = e.items[k - 1]; e.items[k - 1] = e.items[k]; e.items[k] = t; } break;
    case 'ed-down': if (k < e.items.length - 1){ const t = e.items[k + 1]; e.items[k + 1] = e.items[k]; e.items[k] = t; } break;
    case 'ed-rm': e.items.splice(k, 1); break;
    case 'ed-delete':
      if (prev === 'ed-delete'){
        state.programs = state.programs.filter(p => p.id !== e.id); persistPrograms();
        state.edit = null; setView('programs'); toast('Programme supprimé');
      } else arm('ed-delete');
      break;

    case 'pk-back': setView('editor'); break;
    case 'pk-add': addToEdit(id); break;
    case 'pk-new': state.newEx = {name:state.pickQuery.trim(), g:'Pectoraux', bw:false, step:2.5}; setView('newex'); break;
    case 'nx-back': state.newEx = null; setView('picker'); break;
    case 'nx-type': state.newEx.bw = id === 'bw'; break;
    case 'nx-step': state.newEx.step = parseFloat(id); break;
    case 'nx-save': saveNewEx(); break;

    case 'metric': state.metric = id; break;
    case 'ptab': state.progTab = id; state.calDay = null; break;
    case 'bw-inc': case 'bw-dec': bwStep(a === 'bw-inc' ? 1 : -1); if (!prev) return; break;
    case 'bw-save': if (!saveWeight()) return; break;
    case 'del-w':
      if (prev === 'delw' + id){ state.weights = state.weights.filter(w => w.d !== id); persistWeights(); toast('Pesée supprimée'); }
      else arm('delw' + id);
      break;
    case 'cal-prev': case 'cal-next': {
      const c = state.calMonth, dt = new Date(c.y, c.m + (a === 'cal-next' ? 1 : -1), 1);
      state.calMonth = {y:dt.getFullYear(), m:dt.getMonth()}; state.calDay = null;
      break;
    }
    case 'cal-day': state.calDay = state.calDay === id ? null : id; break;
    case 'pref-toggle':
      state.prefs[id] = !state.prefs[id]; LS.set(K.prefs, state.prefs);
      if (id === 'vibrate' && state.prefs.vibrate) buzz(40);
      if (id === 'sound' && state.prefs.sound) beep();
      break;
    case 'toggle-sess': state.openSession = state.openSession === id ? null : id; break;
    case 'del-sess':
      if (prev === 'del' + id){
        state.sessions = state.sessions.filter(s => s.id !== id); persist();
        if (state.openSession === id) state.openSession = null;
        toast('Séance supprimée');
      } else arm('del' + id);
      break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('import-file').click(); break;
  }
  render();
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if (!el.matches) return;
  if (el.id === 'bw-in'){
    const v = parseNum(el.value); if (!isNaN(v)) state.bwInput = v;
  } else if (el.matches('.stp-v input') && el.dataset.f && state.draft){
    const f = el.dataset.f;
    const v = f === 'w' ? parseNum(el.value) : parseInt(el.value, 10);
    if (!isNaN(v)){ inputsFor(state.draft.idx)[f] = f === 'w' ? round2(v) : v; saveDraft(); }
  } else if (el.id === 'ed-name' && state.edit){
    state.edit.name = el.value;
  } else if (el.id === 'nx-name' && state.newEx){
    state.newEx.name = el.value;
  } else if (el.id === 'pk-q'){
    state.pickQuery = el.value;
    const list = document.getElementById('pk-list'); if (list) list.innerHTML = pickList();
  }
});
document.addEventListener('focusin', ev => {
  if (ev.target.matches && ev.target.matches('.stp-v input')) setTimeout(() => { try { ev.target.select(); } catch(e){} }, 0);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('.stp-v input, #ed-name, #nx-name, #pk-q, #bw-in')) ev.target.blur();
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'ex-select'){
    state.progEx = el.value; state.metric = defaultMetric(state.progEx); state.confirm = null; render();
  } else if (el.id === 'nx-group' && state.newEx){
    state.newEx.g = el.value;
  } else if (el.id === 'import-file' && el.files && el.files[0]){
    el.files[0].text().then(importData).catch(() => toast('Lecture du fichier impossible'));
    el.value = '';
  }
});

let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (state.view === 'progress') drawChart(); }, 120); });

setInterval(() => {
  const d = state.draft;
  if (!d) return;
  const ri = restInfo(d);
  let ping = false;
  if (ri && ri.done && d.restAlert !== d.lastSetAt){
    d.restAlert = d.lastSetAt; saveDraft();
    if (ri.sec - ri.target < 5){ buzz([180, 90, 180, 90, 260]); beep(); ping = true; }
  }
  if (state.view !== 'session') return;
  const tm = document.getElementById('timer');
  if (tm){
    const ts = timerState(d);
    tm.className = 'timer ' + ts.cls + (ping ? ' ping' : '');
    tm.style.setProperty('--p', ts.p.toFixed(3));
    document.getElementById('tm-v').textContent = ts.v;
    document.getElementById('tm-l').innerHTML = ts.l;
  }
  const el = document.getElementById('elapsed'); if (el) el.textContent = elapsed(d.startedAt);
}, 1000);

/* ---------- Animation d'ouverture : Fissure ---------- */
{
  const sp = document.getElementById('splash');
  if (sp){
    let raf = 0, dust = [], timer = 0;
    const done = () => { cancelAnimationFrame(raf); clearTimeout(timer); if (sp.isConnected) sp.remove(); };
    sp.addEventListener('animationend', e => { if (e.target === sp) done(); });
    sp.addEventListener('click', () => sp.classList.add('skip'));
    setTimeout(done, 4600);
    if (!reduceMotion()){
      // Poussière qui jaillit le long de la fissure de « casser »
      timer = setTimeout(() => {
        const cv = document.getElementById('sp-cv'), crk = sp.querySelector('.sp-crk');
        if (!cv || !crk) return;
        const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
        const W = sp.clientWidth, H = sp.clientHeight;
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const r = crk.getBoundingClientRect();
        [[0, 58], [18, 52], [31, 63], [47, 47], [60, 56], [76, 42], [100, 46]].forEach(([px, py]) => {
          const x = r.left + r.width * px / 100, y = r.top + r.height * py / 100;
          for (let i = 0; i < 22; i++){
            const a = rnd(0, 6.2832), v = 1 + Math.pow(Math.random(), 2) * 7;
            const life = rnd(70, 160);
            dust.push({x:x + rnd(-6, 6), y:y + rnd(-4, 4), vx:Math.cos(a) * v, vy:Math.sin(a) * v, size:rnd(0.8, 2.8), alpha:rnd(0.3, 0.9), life, max:life});
          }
          for (let i = 0; i < 2; i++){
            const a = rnd(0, 6.2832), life = rnd(100, 160);
            dust.push({x, y, vx:Math.cos(a) * rnd(0.5, 3), vy:Math.sin(a) * rnd(0.5, 2), size:rnd(14, 34), alpha:1, life, max:life, puff:true});
          }
        });
        let last = performance.now();
        const step = now => {
          const dt = Math.min(2.5, (now - last) / 16.67); last = now;
          ctx.clearRect(0, 0, W, H);
          dust = dust.filter(p => (p.life -= dt) > 0);
          for (const p of dust){
            const dr = Math.pow(p.puff ? 0.94 : 0.92, dt);
            p.vx *= dr; p.vy = p.vy * dr + (p.puff ? 0 : 0.05) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
            const al = p.alpha * p.life / p.max;
            if (p.puff){
              const rr = p.size * (1.7 - 0.7 * p.life / p.max), gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
              gr.addColorStop(0, `rgba(236,234,228,${(0.25 * al).toFixed(3)})`); gr.addColorStop(1, 'rgba(236,234,228,0)');
              ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 6.2832); ctx.fill();
            } else {
              ctx.globalAlpha = al; ctx.fillStyle = '#ECEAE4'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.2832); ctx.fill(); ctx.globalAlpha = 1;
            }
          }
          if (dust.length && sp.isConnected) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
      }, 1350);
    }
  }
}

/* ---------- Démarrage ---------- */
fxInit();
if (state.draft) setView('session');
render();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
})();
